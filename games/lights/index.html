<style>
.lgrid{--cs:clamp(44px,min(calc((100vw - 70px)/var(--n)),calc((100dvh - 330px)/var(--n))),100px);display:grid;grid-template-columns:repeat(var(--n),var(--cs));grid-auto-rows:var(--cs);gap:10px;
  padding:14px;border-radius:20px;background:radial-gradient(circle at 50% 30%,#1e2636,#121620)}
.lb{border:0;padding:0;border-radius:50%;cursor:pointer;background:#2a3140;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.05);transition:background .15s,box-shadow .15s,transform .08s;touch-action:manipulation;position:relative}
.lb:active{transform:scale(.94)}
.lb.on{background:radial-gradient(circle at 40% 35%,#fffbe0,#ffe066 35%,#f2b705 70%);box-shadow:0 0 calc(var(--cs)*.35) rgba(255,214,64,.75),inset 0 -5px 0 rgba(0,0,0,.15)}
.lb.hint::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px solid #7cc8ff;animation:lring .8s ease infinite}
@keyframes lring{50%{transform:scale(1.08);opacity:.5}}
.lgrid.won .lb{background:#1f2a20;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.lb{transition:none}.lb.hint::after{animation:none}}
</style>
</head>
<body>
<script src="../../shared/ts.js?v=f30d1a5c"></script>
<script src="../../shared/kit.js?v=f30d1a5c"></script>
<script>
(()=>{
/* Lights Out: tapping a light flips it and the lights next to it (up, down, left, right). Turn every light off.
   Puzzles are made by pressing lights on a dark board, so they always have an answer, and par is the true
   fewest taps (worked out exactly). Boards grow 3x3 → 4x4 → 5x5 (6x6 for older grades). */
let K,S=null;
function pick(steps,n){let v=steps[0];for(const s of steps)if(n>=s[0])v=s;return v}
// [fromLevel, size, presses at start of band, presses at end]
const PLAN={1:[[1,3,1,4],[16,4,3,6],[31,5,4,8]],2:[[1,3,1,4],[11,4,3,6],[26,5,4,9]],3:[[1,3,1,3],[7,4,3,6],[19,5,5,9],[33,5,8,12]],
  4:[[1,3,2,4],[5,4,3,7],[15,5,5,10],[30,6,6,12]],5:[[1,4,2,6],[8,5,4,10],[25,6,6,14]],6:[[1,4,3,7],[6,5,5,11],[20,6,7,15]],7:[[1,4,4,8],[5,5,6,12],[16,6,8,18]]};
function spec(n){const P=PLAN[K.grade],b=pick(P,n),i=P.indexOf(b),to=i+1<P.length?P[i+1][0]-1:40,t=(n-b[0])/Math.max(1,to-b[0]);
  return{size:b[1],presses:Math.round(b[2]+(b[3]-b[2])*t)}}
const press=(g,N,i)=>{const r=(i/N)|0,c=i%N;g[i]^=1;if(r>0)g[i-N]^=1;if(r<N-1)g[i+N]^=1;if(c>0)g[i-1]^=1;if(c<N-1)g[i+1]^=1};
/* Fewest taps to turn everything off: solve the on/off equations (mod 2), then try every free choice to find the smallest answer. */
function solve(g,N){const M=N*N,rows=[];
  for(let i=0;i<M;i++){const row=new Uint8Array(M+1),t=new Uint8Array(M);press(t,N,i);for(let j=0;j<M;j++)if(t[j])row[j]=1;rows.push(row)}
  // rows[j][i] = pressing i flips j (symmetric), last column = light j is on
  for(let j=0;j<M;j++)rows[j][M]=g[j];
  const piv=[];let r=0;
  for(let c=0;c<M&&r<M;c++){let p=-1;for(let k=r;k<M;k++)if(rows[k][c]){p=k;break}if(p<0)continue;[rows[r],rows[p]]=[rows[p],rows[r]];
    for(let k=0;k<M;k++)if(k!==r&&rows[k][c])for(let x=c;x<=M;x++)rows[k][x]^=rows[r][x];piv.push(c);r++}
  for(let k=r;k<M;k++)if(rows[k][M])return null; // not solvable (never happens for made puzzles)
  const free=[...Array(M).keys()].filter(c=>!piv.includes(c));let best=null;
  for(let mask=0;mask<1<<free.length;mask++){const x=new Uint8Array(M);free.forEach((c,k)=>x[c]=(mask>>k)&1);
    for(let k=r-1;k>=0;k--){const c=piv[k];let v=rows[k][M];for(let y=c+1;y<M;y++)if(rows[k][y]&&x[y])v^=1;x[c]=v}
    const w=x.reduce((a,b)=>a+b,0);if(!best||w<best.w)best={x,w}}
  return best}
function start(n){const sp=spec(n),r=K.rng(n),N=sp.size;let g,sol;
  for(let t=0;t<30;t++){g=new Uint8Array(N*N);const cells=[...Array(N*N).keys()];
    for(let k=cells.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[cells[k],cells[j]]=[cells[j],cells[k]]}
    cells.slice(0,sp.presses).forEach(i=>press(g,N,i));sol=solve(g,N);if(sol&&sol.w>=Math.min(sp.presses,Math.max(1,sp.presses-2)))break}
  K.stage.insertAdjacentHTML("beforeend",'<div class="lgrid" id="lg"></div>');
  S={sp,N,g,par:sol.w,taps:0,el:document.getElementById("lg")};S.el.style.setProperty("--n",N);
  for(let i=0;i<N*N;i++){const b=document.createElement("button");b.type="button";b.className="lb";b.dataset.i=i;b.onclick=()=>tap(i);S.el.appendChild(b)}
  draw();K.sub("Par "+S.par);K.tip("Tap a light to flip it and its neighbours. Turn them all off!")}
function draw(){S.el.querySelectorAll(".lb").forEach((b,i)=>{b.classList.toggle("on",!!S.g[i]);b.setAttribute("aria-label",S.g[i]?"Light on":"Light off")});
  const on=S.g.reduce((a,b)=>a+b,0);K.stat(on,on===1?"Light on":"Lights on")}
function tap(i){if(K.busy)return;S.el.querySelectorAll(".lb.hint").forEach(b=>b.classList.remove("hint"));press(S.g,S.N,i);S.taps++;TS.music.fx("tap");draw();
  K.sub("Taps "+S.taps+" · par "+S.par);
  if(S.g.every(v=>!v)){S.el.classList.add("won");const st=S.taps<=S.par?3:S.taps<=S.par+3?2:1;K.win({stars:st,text:S.taps+" taps · par "+S.par+(st===3?" · lights out!":"")})}}
/* Hint: ring one light that's part of the fewest-taps answer from here. */
function hint(){if(!S||K.busy)return;const s=solve(S.g,S.N);if(!s||!s.w)return;const i=s.x.indexOf(1);S.el.querySelector('.lb[data-i="'+i+'"]').classList.add("hint");
  K.tip("Try tapping the light with the blue ring.")}
K=TS_KIT({id:"lights",name:"Lights Out",levels:40,start,hint,label:n=>{const s=spec(n);return s.size+"×"+s.size}});
window.__game={get S(){return S},K,spec,solve};// for tools/test_games4.py
K.start();
})();
</script>
</body>
</html>
