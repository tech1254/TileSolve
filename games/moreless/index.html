<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>More or Less · Tile Solve</title>
<meta name="apple-mobile-web-app-title" content="Tile Solve">
<link rel="apple-touch-icon" href="../../icon-180.png">
<link rel="icon" type="image/png" href="../../icon-512.png">

<body>
<script src="../../shared/ts.js?v=cb83ca14"></script>
<script src="../../shared/kit.js?v=cb83ca14"></script>
<link rel="stylesheet" href="../../shared/learn.css?v=cb83ca14">
<script src="../../shared/learn.js?v=cb83ca14"></script>
<script>
(()=>{const U=TS_LEARN.util;
TS_LEARN({id:"moreless",name:"More or Less",howto:[["⚖️", "Look at both sides."], ["👂", "Listen: is it asking for more, or fewer?"], ["👆", "Tap the right one."], ["🔊", "Tap the speaker to hear it again."]],
make(n,i,r,a){
  if(a<=0){const EM=["🍎","⭐","🐟","🎈","🐞","🍪","🦆","🍓"],em=U.pick(r,EM),gap=n<=15?2:1;let x,y;do{x=U.ri(r,1,7);y=U.ri(r,1,7)}while(Math.abs(x-y)<gap);
    const fewer=n>20&&i%2===1,ans=(fewer?x<y:x>y)?"L":"R";
    return{type:"pick",cols:2,say:fewer?"Which group has fewer?":"Which group has more?",prompt:'<span class="ask">Which has '+(fewer?"fewer":"more")+"?</span>",
      options:[{key:"L",html:U.cluster(em,x,3),aria:x+" pictures"},{key:"R",html:U.cluster(em,y,3),aria:y+" pictures"}],answer:ans}}
  const k=n>20?3:2,big=i%2===0;let nums;
  if(a===1){const s=new Set();while(s.size<k)s.add(U.ri(r,1,20));nums=[...s]}
  else{const s=new Set();const b=U.ri(r,12,98);s.add(b);const sw=+(String(b%10)+String(Math.floor(b/10)));if(b%10&&sw!==b&&sw>9)s.add(sw);
    while(s.size<k)s.add(Math.max(10,Math.min(99,b+U.ri(r,-9,9))));nums=[...s].slice(0,k)}
  const ans=big?Math.max(...nums):Math.min(...nums),w=a===1?(big?"bigger":"smaller"):(big?"greater":"less");
  return{type:"pick",cols:k,say:"Which number is "+w+"?",prompt:'<span class="ask">Which number is '+w+"?</span>",
    options:U.shuffle(r,nums).map(v=>({key:v,html:String(v)})),answer:ans}}});
})();
</script>
</body>
</html>
