<html lang="en">
<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>Unblock the Car · Tile Solve</title>

<style>
/* Layout: one-screen night parking garage. HUD on top, asphalt lot in the middle, thumb controls at the bottom. */
body{overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.top{width:100%;max-width:460px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.left{display:flex;gap:6px;align-items:center}
.lvl{display:flex;align-items:baseline;gap:8px;justify-content:center}
.num{font-family:var(--font-sign);font-size:30px;line-height:1;color:var(--paint);font-variant-numeric:tabular-nums}
.right{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.stat{display:grid;justify-items:end;gap:2px;font-variant-numeric:tabular-nums}
.stat #moves{font-family:var(--font-sign);font-size:22px;line-height:1}
.stat b{color:var(--text)}

.stage{flex:1;display:grid;place-items:center;width:100%;min-height:0;overflow:hidden}
.lot{--bw:max(220px,min(calc(100vw - 64px),440px,calc(100dvh - 270px)));
  position:relative;padding:10px;background:var(--asphalt);border-radius:16px;
  box-shadow:0 0 0 3px var(--lane),0 18px 40px rgba(0,0,0,.45)}
.grid{position:relative;width:var(--bw);height:var(--bw);touch-action:none;border-radius:6px;
  background-image:linear-gradient(var(--lane) 1px,transparent 1px),linear-gradient(90deg,var(--lane) 1px,transparent 1px);
  background-size:calc(100%/6) calc(100%/6);background-position:-1px -1px}
.exit{position:absolute;right:-3px;top:calc(10px + var(--bw)*2/6);height:calc(var(--bw)/6);width:13px;
  background:repeating-linear-gradient(45deg,var(--paint) 0 6px,var(--night) 6px 12px);border-radius:0 6px 6px 0}
.exit::after{content:"EXIT";position:absolute;left:18px;top:50%;transform:translateY(-50%);font-family:var(--font-sign);font-size:11px;color:var(--paint);letter-spacing:.05em}

.car{position:absolute;padding:4px;box-sizing:border-box;cursor:grab;touch-action:none;
  transition:left .14s ease,top .14s ease,transform .14s ease,opacity .4s}
/* While dragging (and for the one frame where a released car is re-anchored) nothing animates. */
.car.drag{transition:none;cursor:grabbing;z-index:3}
.car>i{display:block;width:100%;height:100%;border-radius:10px;background:var(--c);position:relative;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.28),0 3px 6px rgba(0,0,0,.35)}
.car>i::after{content:"";position:absolute;background:rgba(15,22,30,.55);border-radius:5px}
.car.h>i::after{top:18%;bottom:18%;right:16%;width:18%}
.car.v>i::after{left:18%;right:18%;top:16%;height:18%}
.car.target>i::before{content:"";position:absolute;left:12%;top:50%;width:22%;height:4px;margin-top:-2px;background:rgba(255,255,255,.55);border-radius:2px}
.car.hint>i{animation:pulse .7s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 4px var(--paint)}}
.ghost{position:absolute;padding:4px;box-sizing:border-box;pointer-events:none}
.ghost>i{display:block;width:100%;height:100%;border-radius:10px;border:3px dashed var(--paint);box-sizing:border-box}
.car.leave{transition:transform .55s cubic-bezier(.5,0,.9,.4),opacity .55s;opacity:0}

.controls{width:100%;max-width:460px;display:grid;grid-template-columns:52px 1fr 1fr 1fr 52px;gap:8px}
.controls button{background:var(--panel);border:1px solid var(--lane);border-radius:12px;padding:13px 0;font-weight:700;font-size:15px;cursor:pointer}
.controls button:active{transform:translateY(1px)}
.controls button:disabled{opacity:.35}
.controls .arrow{font-size:22px;padding:8px 0}
.tip{margin:0;color:var(--muted);font-size:14px;text-align:center;min-height:2.6em;max-width:36ch}

.pages{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pages button{flex:none;background:var(--asphalt);border:1px solid var(--lane);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.pages button.on{background:var(--paint);color:var(--night);border-color:var(--paint)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow-y:auto;min-height:0}
.levels button{background:var(--asphalt);border:1px solid var(--lane);border-radius:10px;padding:8px 0 6px;cursor:pointer;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.levels button b{font-size:16px}
.levels button span{font-size:10px;color:var(--paint);letter-spacing:1px;min-height:12px}
.levels button.cur{border-color:var(--paint)}
.levels button:disabled{opacity:.35;cursor:default}
.stars{font-size:40px;letter-spacing:6px;color:var(--paint);text-align:center;line-height:1}
.stars .off{color:var(--lane)}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btns button{border-radius:12px;padding:14px 0;font-weight:700;cursor:pointer;border:1px solid var(--lane);background:var(--asphalt)}
.btns .go{background:var(--paint);color:var(--night);border-color:var(--paint)}
@media (prefers-reduced-motion:reduce){.car,.car.leave{transition:none}.car.hint>i{animation:none;box-shadow:0 0 0 4px var(--paint)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="left">
      <a class="chip icon" id="btnHome" href="../../index.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
      <button class="chip icon" id="btnLevels" type="button" aria-label="Levels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
      <button class="chip icon" id="btnMusic" type="button"></button>
    </div>
    <div class="lvl"><span class="lbl">Level</span><span class="num" id="lvlNum">1</span></div>
    <div class="right"><button class="chip icon help" id="btnHelp" type="button" aria-label="How to play">?</button><div class="stat"><span id="moves">0</span><span class="lbl">Par <b id="par">–</b></span></div></div>
  </header>
  <main class="stage">
    <div class="lot">
      <div class="grid" id="grid"></div>
      <div class="exit" aria-hidden="true"></div>
    </div>
  </main>
  <nav class="controls">
    <button class="arrow" id="btnPrev" type="button" aria-label="Previous level">‹</button>
    <button id="btnUndo" type="button">Undo</button>
    <button id="btnReset" type="button">Reset</button>
    <button id="btnHint" type="button">Hint</button>
    <button class="arrow" id="btnNext" type="button" aria-label="Next level">›</button>
  </nav>
  <p class="tip" id="tip">Drag cars along their lanes. Slide the red car out the exit.</p>
</div>

<div class="sheet" id="sheetLevels" hidden>
  <div class="card">
    <div class="row"><h2>1,000 levels</h2><button class="close" id="closeLevels" type="button">Close</button></div>
    <span class="toggle">Playing as&nbsp;<b id="whoLbl"></b></span>
    <div class="pages" id="pages"></div>
    <div class="levels" id="levelGrid"></div>
    <label class="toggle"><input type="checkbox" id="unlockAll"> Open every level (for testing)</label>
  </div>
</div>

<div class="sheet" id="sheetWin" hidden>
  <div class="card">
    <h2 id="winTitle">Level 1 cleared</h2>
    <div class="stars" id="winStars"></div>
    <p class="result" id="winText"></p>
    <div class="btns"><button id="btnReplay" type="button">Replay</button><button class="go" id="btnWinNext" type="button">Next level</button></div>
  </div>
</div>

<script>
(()=>{
const PLAYER=TS.requirePlayer(),Music=TS.music;
const TOTAL=1000;
const P6=[];for(let i=0,v=1;i<16;i++,v*=6)P6.push(v);
const COLORS=["#2a9d8f","#3b6fd9","#f08a24","#8f5bd6","#6bb34a","#e06aa6","#d9b37a","#4fb3d9","#c7cfd6"];
const TRUCKS=["#1f6f8b","#7a4fb5","#b86b1f","#3f7d3a","#9a3d6e"];
const GRADE=Math.max(1,TS.players.gnum(PLAYER.grade)); // Kindergarten plays grade 1 puzzles

/* ---------- seeded random ---------- */
function rngFrom(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- puzzle engine (used for hints) ---------- */
function encode(pos){let k=0;for(let i=0;i<pos.length;i++)k+=pos[i]*P6[i];return k}
function decode(k,n,out){for(let i=0;i<n;i++){out[i]=k%6;k=Math.floor(k/6)}return out}
function fillGrid(pos,cars,grid,skip){grid.fill(-1);
  for(let i=0;i<cars.length;i++){if(i===skip)continue;const c=cars[i],p=pos[i];
    for(let j=0;j<c.len;j++)grid[c.h?c.f*6+p+j:(p+j)*6+c.f]=i}}
function eachNext(key,pos,cars,grid,cb){
  fillGrid(pos,cars,grid,-1);
  for(let i=0;i<cars.length;i++){const c=cars[i],p=pos[i],w=P6[i];
    if(c.h){const b=c.f*6;
      for(let q=p-1;q>=0&&grid[b+q]<0;q--)cb(key+(q-p)*w,i,q);
      for(let e=p+c.len;e<6&&grid[b+e]<0;e++){const q=e-c.len+1;cb(key+(q-p)*w,i,q)}
    }else{
      for(let q=p-1;q>=0&&grid[q*6+c.f]<0;q--)cb(key+(q-p)*w,i,q);
      for(let e=p+c.len;e<6&&grid[e*6+c.f]<0;e++){const q=e-c.len+1;cb(key+(q-p)*w,i,q)}
    }}}
function solveNext(cars,pos){
  const n=cars.length,tmp=new Array(n),grid=new Int8Array(36),start=encode(pos);
  if(pos[0]===4)return null;
  const prev=new Map([[start,null]]),q=[start];
  for(let h=0;h<q.length;h++){const k=q[h];decode(k,n,tmp);
    if(tmp[0]===4){let cur=k,step=prev.get(cur);while(step&&step.from!==start){cur=step.from;step=prev.get(cur)}return step}
    eachNext(k,tmp,cars,grid,(nk,i,to)=>{if(!prev.has(nk)){prev.set(nk,{from:k,i,to});q.push(nk)}});
    if(q.length>600000)return null}
  return null}

const BUCKETS=new Map();
(()=>{const s=atob(BANK_B64);let i=0;
  while(i<s.length){const par=s.charCodeAt(i++),n=s.charCodeAt(i++),b=new Uint8Array(n);
    for(let k=0;k<n;k++)b[k]=s.charCodeAt(i++);
    if(!BUCKETS.has(par))BUCKETS.set(par,[]);BUCKETS.get(par).push(b)}
  // Shuffle each bucket once with a fixed seed, so neighbouring levels don't look alike.
  for(const[p,list]of BUCKETS){const r=rngFrom(p*7919+13);for(let k=list.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[list[k],list[j]]=[list[j],list[k]]}}})();
const PARS=[...BUCKETS.keys()].filter(p=>BUCKETS.get(p).length>=8).sort((a,b)=>a-b);
const MAXPAR=PARS[PARS.length-1];

/* ---------- difficulty curve ----------
   Par (shortest solution) climbs fast to a grade-appropriate "challenging" level by level 30,
   then keeps creeping up towards the hardest puzzles in the bank. */
const CURVE={1:[3,14,30],2:[4,17,33],3:[4,20,36],4:[5,22,38],5:[6,24,40],6:[7,26,42],7:[8,28,45]};
function targetPar(g,n){const[s,p30,cap]=CURVE[g]||CURVE[3],top=Math.min(cap,MAXPAR);let t;
  if(n<=30)t=s+(Math.min(p30,top)-s)*Math.pow((n-1)/29,0.85);
  else t=p30+(top-p30)*(1-Math.exp(-(n-30)/220));
  return Math.round(Math.min(t,top))}
function bucketFor(t){if(PARS.includes(t))return t;
  for(let d=1;d<60;d++){if(PARS.includes(t-d))return t-d;if(PARS.includes(t+d))return t+d}return PARS[0]}
const plans=new Map();
function planFor(g){if(plans.has(g))return plans.get(g);
  const arr=[null],used={};
  for(let n=1;n<=TOTAL;n++){const b=bucketFor(targetPar(g,n)),list=BUCKETS.get(b),k=used[b]=(used[b]||0)+1;
    arr.push({b,ix:(g*37+k-1)%list.length})}
  plans.set(g,arr);return arr}
function getLevel(g,n){const e=planFor(g)[n],bytes=BUCKETS.get(e.b)[e.ix],cars=[],pos=[];
  for(const x of bytes){cars.push({h:!!(x&1),len:x&2?3:2,f:(x>>2)&7});pos.push(x>>5)}
  return{cars,pos,par:e.b}}

/* ---------- save: per player, and per grade within a player (so changing a grade never loses stars) ---------- */
const SAVE=TS.gameSave("car",{grades:{},all:false}),save=SAVE.data,persist=SAVE.save;
const prog=()=>save.grades[GRADE]||(save.grades[GRADE]={unlocked:1,stars:{},last:1});

/* ---------- game state ---------- */
const $=id=>document.getElementById(id);
const gridEl=$("grid");
let level=1,L=null,pos=[],hist=[],moves=0,els=[],busy=false,drag=null,ghost=null;
const canPlay=n=>n>=1&&n<=TOTAL&&(save.all||n<=prog().unlocked);
$("btnMusic").innerHTML=TS.MUSIC_SVG;Music.button($("btnMusic"));

function place(i){const c=L.cars[i],el=els[i],s=100/6;
  el.style.left=(c.h?pos[i]:c.f)*s+"%";el.style.top=(c.h?c.f:pos[i])*s+"%";
  el.style.width=(c.h?c.len:1)*s+"%";el.style.height=(c.h?1:c.len)*s+"%"}
function hud(){$("lvlNum").textContent=level;$("moves").textContent=moves;$("par").textContent=L?L.par:"–";
  $("btnUndo").disabled=!hist.length;$("btnPrev").disabled=level<=1;$("btnNext").disabled=!canPlay(level+1)}
function clearHint(){if(ghost){ghost.remove();ghost=null}els.forEach(e=>e.classList.remove("hint"))}
function tip(t){$("tip").textContent=t||"Drag cars along their lanes. Slide the red car out the exit."}

function load(n){
  if(TS.gate.pending(prog(),n)){$("sheetWin").hidden=true;TS.gate.open(prog(),n,persist,load);return} // maths checkpoint first
  level=n;prog().last=n;persist();busy=false;gridEl.innerHTML="";els=[];
  L=getLevel(GRADE,n);pos=L.pos.slice();hist=[];moves=0;tip();
  let ci=n%COLORS.length,ti=n%TRUCKS.length;
  L.cars.forEach((c,i)=>{const el=document.createElement("div");
    el.className="car "+(c.h?"h":"v")+(i===0?" target":"");el.dataset.i=i;
    const col=i===0?"var(--target)":c.len===3?TRUCKS[ti++%TRUCKS.length]:COLORS[ci++%COLORS.length];
    el.style.setProperty("--c",col);el.appendChild(document.createElement("i"));
    gridEl.appendChild(el);els.push(el);place(i)});
  hud();if(n===1&&!TS.howto.isOpen)setTimeout(carPoint,350)}

function range(i){const c=L.cars[i],g=new Int8Array(36);fillGrid(pos,L.cars,g,i);let lo=pos[i],hi=pos[i];
  if(c.h){const b=c.f*6;while(lo>0&&g[b+lo-1]<0)lo--;while(hi+c.len<6&&g[b+hi+c.len]<0)hi++}
  else{while(lo>0&&g[(lo-1)*6+c.f]<0)lo--;while(hi+c.len<6&&g[(hi+c.len)*6+c.f]<0)hi++}
  return{lo,hi}}

gridEl.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".car");if(!el||busy||drag)return;clearHint();
  const i=+el.dataset.i,r=range(i);
  drag={i,el,lo:r.lo,hi:r.hi,start:pos[i],cur:pos[i],x:e.clientX,y:e.clientY,cell:gridEl.clientWidth/6};
  el.setPointerCapture(e.pointerId);el.classList.add("drag")});
gridEl.addEventListener("pointermove",e=>{if(!drag)return;const c=L.cars[drag.i];
  const d=(c.h?e.clientX-drag.x:e.clientY-drag.y)/drag.cell;
  drag.cur=Math.min(drag.hi,Math.max(drag.lo,drag.start+d));
  drag.el.style.transform=(c.h?"translateX(":"translateY(")+(drag.cur-drag.start)*drag.cell+"px)"});
/* Releasing a car: re-anchor it at its new cell instantly, offset by where the finger left it,
   then animate only that small offset away. (Animating left/top and transform at once made the
   car spring back towards its start before landing, because browsers run the two out of step.) */
function endDrag(){if(!drag)return;const{i,el,cell}=drag,c=L.cars[i],np=Math.round(drag.cur),off=(drag.cur-np)*cell;drag=null;
  if(np!==pos[i]){hist.push(pos.slice());pos[i]=np;moves++}
  place(i);
  el.style.transform=off?(c.h?"translateX(":"translateY(")+off+"px)":"";
  void el.offsetWidth; // commit the re-anchored position before turning transitions back on
  el.classList.remove("drag");el.style.transform="";
  hud();if(pos[0]===4)win()}
gridEl.addEventListener("pointerup",endDrag);gridEl.addEventListener("pointercancel",endDrag);

function win(){busy=true;const el=els[0];Music.fx("win");
  setTimeout(()=>{el.classList.add("leave");el.style.transform="translateX("+gridEl.clientWidth*0.75+"px)"},150);
  const s=moves<=L.par?3:moves<=Math.ceil(L.par*1.5)?2:1,pr=prog();
  pr.stars[level]=Math.max(pr.stars[level]||0,s);TS.gate.afterWin(pr,level,TOTAL);
  if(level+1>pr.unlocked)pr.unlocked=Math.min(TOTAL,level+1);persist();
  setTimeout(()=>{
    $("winTitle").textContent=level===TOTAL?"All 1,000 levels cleared!":"Level "+level+" cleared";
    $("winStars").innerHTML="★".repeat(s)+'<span class="off">'+"★".repeat(3-s)+"</span>";
    $("winText").textContent=moves+" moves · par "+L.par+(s===3?" · perfect":"");
    $("btnWinNext").hidden=level>=TOTAL;$("btnWinNext").textContent=TS.gate.pending(pr,level+1)?"Maths, then next level":"Next level";
    $("sheetWin").hidden=false;hud()},750)}

function showHint(){if(busy||!L)return;clearHint();const s=solveNext(L.cars,pos);if(!s)return;
  const c=L.cars[s.i],el=els[s.i];el.classList.add("hint");
  ghost=document.createElement("div");ghost.className="ghost";ghost.appendChild(document.createElement("i"));
  const sz=100/6;ghost.style.left=(c.h?s.to:c.f)*sz+"%";ghost.style.top=(c.h?c.f:s.to)*sz+"%";
  ghost.style.width=(c.h?c.len:1)*sz+"%";ghost.style.height=(c.h?1:c.len)*sz+"%";gridEl.appendChild(ghost);
  const dir=c.h?(s.to>pos[s.i]?"right":"left"):(s.to>pos[s.i]?"down":"up");
  tip("Hint: slide the flashing "+(s.i===0?"red car":c.len===3?"truck":"car")+" "+dir+" to the dashed spot.")}

$("btnUndo").onclick=()=>{if(busy||!hist.length)return;clearHint();pos=hist.pop();moves++;els.forEach((_,i)=>place(i));hud()};
$("btnReset").onclick=()=>{if(busy||!L)return;clearHint();pos=L.pos.slice();hist=[];moves=0;els.forEach((_,i)=>place(i));hud();tip()};
$("btnHint").onclick=()=>{if(busy||!L||pos[0]===4)return;TS.math.open(showHint)}; // a maths question first
$("btnPrev").onclick=()=>{if(level>1&&!busy)load(level-1)};
$("btnNext").onclick=()=>{if(canPlay(level+1)&&!busy)load(level+1)};
$("btnReplay").onclick=()=>{$("sheetWin").hidden=true;load(level)};
$("btnWinNext").onclick=()=>{$("sheetWin").hidden=true;load(Math.min(TOTAL,level+1))};

/* ---------- level picker ---------- */
let page=0;
function drawPicker(){
  const pg=$("pages");pg.innerHTML="";
  for(let p=0;p<10;p++){const b=document.createElement("button");b.type="button";b.textContent=(p*100+1)+"–"+(p*100+100);
    if(p===page)b.className="on";b.onclick=()=>{page=p;drawPicker()};pg.appendChild(b)}
  const lg=$("levelGrid"),pr=prog();lg.innerHTML="";
  for(let n=page*100+1;n<=page*100+100;n++){const b=document.createElement("button");b.type="button";
    const st=pr.stars[n]||0;b.innerHTML="<b>"+n+"</b><span>"+(st?"★".repeat(st):canPlay(n)?"":"🔒")+"</span>";
    if(n===level)b.className="cur";b.disabled=!canPlay(n);
    b.onclick=()=>{$("sheetLevels").hidden=true;load(n)};lg.appendChild(b)}
  $("unlockAll").checked=!!save.all;
  $("whoLbl").textContent=PLAYER.avatar+" "+PLAYER.name+" · "+TS.players.gradeName(GRADE)}
$("btnLevels").onclick=()=>{page=Math.floor((level-1)/100);drawPicker();$("sheetLevels").hidden=false};
$("closeLevels").onclick=()=>{$("sheetLevels").hidden=true};
$("unlockAll").onchange=e=>{save.all=e.target.checked;persist();drawPicker();hud()};
