<title>Sudoku Light · Tile Solve</title>

<style>
.sgrid{--cs:clamp(34px,min(calc((100vw - 64px)/var(--n)),calc((100dvh - 400px)/var(--n))),84px);display:grid;grid-template-columns:repeat(var(--n),var(--cs));grid-auto-rows:var(--cs);
  border:3px solid #9aa6b2;border-radius:10px;overflow:hidden;background:#9aa6b2;gap:1px}
.sc{border:0;padding:0;background:#262d35;color:var(--text);font-family:var(--font-sign);font-size:calc(var(--cs)*.5);line-height:1;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.sc.emo{font-family:var(--font-body);font-size:calc(var(--cs)*.6)}
.sc.given{background:#323a43;color:#cfd6dd;cursor:default}
.sc.mine{color:var(--paint)}
.sc.sel{background:#3d3a24;box-shadow:inset 0 0 0 3px var(--paint)}
.sc.same{background:#2e3540}
.sc.bad{background:#4a2420;color:#ff8a78}
.sc.flash{animation:sflash .8s ease}
@keyframes sflash{40%{background:#4b5f2a}}
.sc.br{margin-right:2px}.sc.bb{margin-bottom:2px}
.spal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:560px}
.spal button{min-width:52px;height:52px;padding:0 8px;border:0;border-radius:14px;background:var(--panel);border:2px solid var(--lane);color:var(--text);
  font-family:var(--font-sign);font-size:24px;cursor:pointer;touch-action:manipulation}
.spal button.emo{font-family:var(--font-body);font-size:28px}
.spal button.cur{border-color:var(--paint);background:#3d3a24}
.spal button.erase{font-family:var(--font-body);font-size:15px;font-weight:700}
.spal button .cnt{display:block;font-family:var(--font-body);font-size:10px;color:var(--muted);margin-top:-2px}
@media (prefers-reduced-motion:reduce){.sc.flash{animation:none}}
</style>
</head>
<body>
<script src="../../shared/ts.js?v=b9dce2af"></script>
<script src="../../shared/kit.js?v=b9dce2af"></script>
<script>
(()=>{
/* Sudoku Light: fill the grid so every row, column and box has each symbol once.
   Starts on 4x4 with animals, then numbers, then 6x6 (9x9 for older grades). Every puzzle has exactly one answer.
   Tap a square, then a symbol (or pick a symbol first and tap squares). Clashes turn red. */
const ANIMALS=["🐶","🐱","🐰","🐸"];
let K,S=null;
function pick(steps,n){let v=steps[0];for(const s of steps)if(n>=s[0])v=s;return v}
// [fromLevel, size, animals?, clues at start of band, clues at end]
const PLAN={1:[[1,4,1,12,8],[16,4,0,10,6],[31,6,0,24,20]],2:[[1,4,1,11,7],[11,4,0,9,6],[23,6,0,24,18]],3:[[1,4,1,11,8],[9,4,0,8,6],[17,6,0,22,16],[31,6,0,15,12]],
  4:[[1,4,0,8,6],[6,6,0,22,15],[30,6,0,15,11]],5:[[1,4,0,7,5],[5,6,0,20,13],[21,9,0,40,32]],6:[[1,6,0,20,14],[11,9,0,42,32]],7:[[1,6,0,16,12],[6,9,0,40,28]]};
function spec(n){const P=PLAN[K.grade],b=pick(P,n),i=P.indexOf(b),to=i+1<P.length?P[i+1][0]-1:40,t=(n-b[0])/Math.max(1,to-b[0]);
  const N=b[1];return{N,animals:!!b[2],clues:Math.round(b[3]+(b[4]-b[3])*t),br:N===4?2:N===6?2:3,bc:N===4?2:3}}
/* ---------- puzzle making ---------- */
function solution(sp,r){const{N,br,bc}=sp,g=[];const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const sym=sh([...Array(N).keys()]),rows=[],cols=[];
  sh([...Array(N/br).keys()]).forEach(b=>sh([...Array(br).keys()]).forEach(x=>rows.push(b*br+x)));
  sh([...Array(N/bc).keys()]).forEach(s=>sh([...Array(bc).keys()]).forEach(x=>cols.push(s*bc+x)));
  for(let r0=0;r0<N;r0++)for(let c0=0;c0<N;c0++){const R=rows[r0],C=cols[c0];g.push(sym[((R%br)*bc+Math.floor(R/br)+C)%N])}return g}
function count(g,sp,limit){const{N,br,bc}=sp,a=g.slice();let found=0;
  const ok=(i,v)=>{const r=(i/N)|0,c=i%N,R=r-r%br,C=c-c%bc;for(let k=0;k<N;k++){if(a[r*N+k]===v||a[k*N+c]===v)return false}
    for(let x=0;x<br;x++)for(let y=0;y<bc;y++)if(a[(R+x)*N+C+y]===v)return false;return true};
  (function go(){if(found>=limit)return;let best=-1,bopts=null;
    for(let i=0;i<a.length;i++)if(a[i]<0){const o=[];for(let v=0;v<N;v++)if(ok(i,v))o.push(v);if(!o.length)return;if(!bopts||o.length<bopts.length){best=i;bopts=o;if(o.length===1)break}}
    if(best<0){found++;return}for(const v of bopts){a[best]=v;go();a[best]=-1;if(found>=limit)return}})();
  return found}
function puzzle(sp,r){const sol=solution(sp,r),g=sol.slice(),order=[...g.keys()];
  for(let k=order.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[order[k],order[j]]=[order[j],order[k]]}
  let clues=g.length;for(const i of order){if(clues<=sp.clues)break;const v=g[i];g[i]=-1;if(count(g,sp,2)!==1)g[i]=v;else clues--}
  return{sol,given:g}}

function start(n){const sp=spec(n),r=K.rng(n),{sol,given}=puzzle(sp,r);
  K.stage.insertAdjacentHTML("beforeend",'<div class="sgrid" id="sg"></div><div class="spal" id="sp"></div>');
  S={sp,sol,given,cur:given.slice(),sel:-1,pen:-1,mistakes:0};draw();
  K.tip("Each row, column and box needs every "+(sp.animals?"animal":"number")+" once. Tap a square, then pick.")}
const label=v=>v<0?"":S.sp.animals?ANIMALS[v]:String(v+1);
function clashes(){const{N,br,bc}=S.sp,a=S.cur,bad=new Set();
  for(let i=0;i<a.length;i++){if(a[i]<0)continue;const r=(i/N)|0,c=i%N;
    for(let j=i+1;j<a.length;j++){if(a[j]!==a[i])continue;const r2=(j/N)|0,c2=j%N;
      if(r===r2||c===c2||(Math.floor(r/br)===Math.floor(r2/br)&&Math.floor(c/bc)===Math.floor(c2/bc))){bad.add(i);bad.add(j)}}}return bad}
function draw(){const{N,br,bc}=S.sp,g=document.getElementById("sg"),bad=clashes(),selV=S.sel>=0?S.cur[S.sel]:S.pen;g.style.setProperty("--n",N);g.innerHTML="";
  S.cur.forEach((v,i)=>{const b=document.createElement("button");b.type="button";const r=(i/N)|0,c=i%N;
    b.className="sc"+(S.sp.animals?" emo":"")+(S.given[i]>=0?" given":" mine")+(i===S.sel?" sel":"")+(v>=0&&v===selV&&i!==S.sel?" same":"")+(bad.has(i)&&S.given[i]<0?" bad":"")+
      ((c%bc===bc-1&&c<N-1)?" br":"")+((r%br===br-1&&r<N-1)?" bb":"");
    b.textContent=label(v);b.dataset.i=i;b.setAttribute("aria-label",v>=0?label(v):"Empty");b.onclick=()=>tapCell(i);g.appendChild(b)});
  const p=document.getElementById("sp");p.innerHTML="";
  for(let v=0;v<N;v++){const b=document.createElement("button");b.type="button";b.className=(S.sp.animals?"emo":"")+(S.pen===v?" cur":"");b.dataset.v=v;
    const left=N-S.cur.filter(x=>x===v).length;b.innerHTML=label(v)+'<span class="cnt">'+(left>0?left+" left":"✓")+"</span>";b.onclick=()=>tapSym(v);p.appendChild(b)}
  const e=document.createElement("button");e.type="button";e.className="erase";e.textContent="Erase";e.onclick=()=>tapSym(-1);p.appendChild(e);
  const empty=S.cur.filter(x=>x<0).length;K.stat(empty,"To fill");K.sub("Mistakes "+S.mistakes)}
function put(i,v){if(S.given[i]>=0)return;const before=clashes().size;S.cur[i]=v;if(v>=0&&clashes().size>before){S.mistakes++;TS.music.fx("bad")}else TS.music.fx("tap");draw();check()}
function tapCell(i){if(K.busy||S.given[i]>=0){if(S.given[i]>=0){S.sel=-1;draw()}return}
  if(S.pen!==-1&&S.sel<0)return put(i,S.cur[i]===S.pen?-1:S.pen);S.sel=S.sel===i?-1:i;draw()}
function tapSym(v){if(K.busy)return;if(S.sel>=0)return put(S.sel,v);S.pen=S.pen===v||v<0?-1:v;draw()}
function check(){if(S.cur.some(v=>v<0)||clashes().size)return;const st=S.mistakes<=1?3:S.mistakes<=3?2:1;
  K.win({stars:st,text:S.sp.N+"×"+S.sp.N+" solved · "+(S.mistakes?S.mistakes+" mistake"+(S.mistakes>1?"s":""):"no mistakes")+(st===3?" · super sleuth!":"")})}
/* Hint: fix a wrong square, or fill the selected (or first) empty square with its answer. */
function hint(){if(!S||K.busy)return;let i=S.cur.findIndex((v,k)=>v>=0&&v!==S.sol[k]);if(i<0)i=S.sel>=0&&S.cur[S.sel]<0?S.sel:S.cur.findIndex(v=>v<0);if(i<0)return;
  S.cur[i]=S.sol[i];S.sel=-1;draw();const b=document.querySelector('.sc[data-i="'+i+'"]');b&&b.classList.add("flash");K.tip("That square is "+label(S.sol[i])+".");check()}
K=TS_KIT({id:"sudoku",howto:[["🐶", "Every row needs each animal (or number) once."], ["⬇️", "So does every column, and every thick-lined box."], ["👆", "Tap an empty square, then tap what goes there."], ["🔴", "Red means two are the same, so fix it!"]],point:()=>document.querySelector(".sc:not(.given)"),name:"Sudoku Light",levels:40,start,hint,label:n=>{const s=spec(n);return s.animals?"🐾":s.N+"×"+s.N}});
window.__game={get S(){return S},K,spec,count};// for tools/test_games3.py
K.start();
})();
</script>
</body>
</html>
