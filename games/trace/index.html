<title>Trace a Letter · Tile Solve</title>
<meta name="apple-mobile-web-app-title" content="Tile Solve">
<link rel="apple-touch-icon" href="../../icon-180.png">

<body>
<script src="../../shared/ts.js?v=f25d63c9"></script>
<script src="../../shared/kit.js?v=f25d63c9"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<link rel="stylesheet" href="../../shared/learn.css?v=f25d63c9">
<script src="../../shared/learn.js?v=f25d63c9"></script>
<script>
(()=>{const U=TS_LEARN.util;

TS_LEARN({id:"trace",name:"Trace a Letter",howto:[["🟢", "Put your finger on the green dot."], ["✍️", "Slide along the grey line to draw it."], ["🔢", "Some letters have more than one line: follow the numbers."], ["🔊", "Tap the speaker to hear it again."]],
rounds:()=>3,label:n=>"",
make(n,i,r,a){const ORDER="LTIEFHVXWAKMNYZOCQGSJUDPBR",DIG="0123456789";let ch;
  if(a<0)ch=i===2&&n>12?DIG[1+(n%5)]:ORDER[((n-1)*2+i)%12];
  else if(a===0)ch=ORDER[((n-1)*3+i)%26];
  else if(a===1)ch=n<=15?ORDER[((n-1)*3+i)%26]:(i===1?DIG[(n+i)%10]:U.pick(r,ORDER.split("")));
  else ch=i%2===1?DIG[U.ri(r,0,9)]:U.pick(r,ORDER.split(""));
  const num=/\d/.test(ch);
  return{type:"trace",ch,say:"Trace the "+(num?"number ":"letter ")+ch+". Start at the green dot.",prompt:'<span class="ask">Trace the '+(num?"number":"letter")+" "+ch+"</span>"}}});
})();
</script>
</body>
</html>
