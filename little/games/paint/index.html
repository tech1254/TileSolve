// each square takes the palette colour that covers most of it
function gridFromScene(sc,w){const c=sceneCanvas(sc),px=c.getContext("2d").getImageData(0,0,240,240).data,pal=sc.pal.map(h=>{const v=parseInt(h.slice(1),16);return[v>>16,v>>8&255,v&255]});
  const near=(r,g,b)=>{let bi=0,bd=1e9;pal.forEach((q,i)=>{const d=(q[0]-r)**2+(q[1]-g)**2+(q[2]-b)**2;if(d<bd){bd=d;bi=i}});return bi},cells=[],used=new Set();
  for(let y=0;y<w;y++)for(let x=0;x<w;x++){const cnt=new Array(pal.length).fill(0);for(let sy=0;sy<3;sy++)for(let sx=0;sx<3;sx++){const X=Math.floor((x+(sx+.5)/3)*240/w),Y=Math.floor((y+(sy+.5)/3)*240/w),o=(Y*240+X)*4;cnt[near(px[o],px[o+1],px[o+2])]++}
    const k=cnt.indexOf(Math.max(...cnt));cells.push(k);used.add(k)}
  // renumber so colours that ended up unused at this size drop out, biggest colour first
  const count=sc.pal.map((_,j)=>cells.filter(c2=>c2===j).length),order=sc.pal.map((_,j)=>j).filter(j=>count[j]).sort((a,b)=>count[b]-count[a]),map={};order.forEach((j,i)=>map[j]=i);
  return{w,h:w,pal:order.map(j=>sc.pal[j]),cells:cells.map(c2=>map[c2])}}

let cv,ctx;
function start(n){const a=K.age,Rg=RANGE(a),u=(n-1)/(SCENES.length-1),sc=SCENES[n-1],w=Math.min(maxGrid(),lerp(Rg[0],Rg[1],u));

function maxGrid(){const r=K.stage.getBoundingClientRect(),side=Math.min(r.width||360,(r.height||600)-170);return Math.max(10,Math.floor(side/(side<420?17:15)))}
function openPic(pic,n){const a=K.age;K.stage.innerHTML='<div class="pb"><p class="pb-title">'+esc(pic.name)+'<small id="pbLeft"></small></p><div class="pb-wrap"><canvas class="pb-cv" id="pbCv"></canvas></div>'+
    '<div class="pb-pal" id="pbPal"></div><div class="pb-bar"><button type="button" id="pbPaint">✏️ Paint</button><button type="button" id="pbFill">🪣 Fill a patch</button><button type="button" id="pbPeek">👀 Peek</button><button type="button" id="pbMine">📷 My pictures</button></div></div>';
  cv=document.getElementById("pbCv");ctx=cv.getContext("2d");
  const saved=n?(K.save.prog||{})[pic.key]:(pic.prog||{})[TS.players.current().id];
  S={pic,n,filled:saved&&saved.length===pic.cells.length?saved.split("").map(Number):pic.cells.map(()=>0),sel:0,tool:a<=0?"fill":"paint",peek:a<=0,helps:0,down:false,done:false,flash:null};
  const first=S.pic.pal.findIndex((_,j)=>left(j)>0);S.sel=first<0?0:first;
  document.getElementById("pbPaint").onclick=()=>tool("paint");document.getElementById("pbFill").onclick=()=>tool("fill");
  document.getElementById("pbPeek").onclick=()=>{S.peek=!S.peek;bar();draw()};document.getElementById("pbMine").onclick=()=>MINE.open();
  cv.addEventListener("pointerdown",e=>{e.preventDefault();S.down=true;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);touch(e,true)});
  cv.addEventListener("pointermove",e=>{if(S.down&&S.tool==="paint")touch(e,false)});
  const up=()=>{if(S)S.down=false;persist()};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  K.sub(n?"":"📷 My picture");K.stat(pic.pal.length,"colours");
  K.tip(a<=0?"Tap a number colour, then tap the squares with that number!":"Pick a colour, then paint every square with its number. Drag to paint lots at once!");
  layout();pal();bar();draw();if(isDone())finish()}
function tool(t){S.tool=t;bar()}
function bar(){document.getElementById("pbPaint").setAttribute("aria-pressed",S.tool==="paint");document.getElementById("pbFill").setAttribute("aria-pressed",S.tool==="fill");document.getElementById("pbPeek").setAttribute("aria-pressed",S.peek)}
const left=j=>S.pic.cells.reduce((a,c,i)=>a+(c===j&&!S.filled[i]?1:0),0);
const isDone=()=>S.filled.every(Boolean);
function pal(){const P=document.getElementById("pbPal");P.innerHTML="";S.pic.pal.forEach((c,j)=>{const b=document.createElement("button");b.type="button";const l=left(j);
    b.style.background=c;b.style.color=light(c)?"#1d2230":"#fff";b.innerHTML=(j+1)+(l?"<small>"+l+"</small>":"<small>✓</small>");b.className=(j===S.sel?"on ":"")+(l?"":"done");
    b.setAttribute("aria-label","colour "+(j+1));b.onclick=()=>{S.sel=j;TS.music.fx("tap");pal();draw()};P.appendChild(b)});
  const tot=S.filled.filter(x=>!x).length;document.getElementById("pbLeft").textContent=tot?tot+" squares to go":"All done!"}
const light=h=>{const v=parseInt(h.slice(1),16);return((v>>16)*.299+(v>>8&255)*.587+(v&255)*.114)>150};
let cell=12;
function layout(){const r=cv.parentElement.getBoundingClientRect(),w=S.pic.w,h=S.pic.h;cell=Math.max(6,Math.floor(Math.min(r.width/w,r.height/h)));
  const dpr=Math.min(2,devicePixelRatio||1);cv.style.width=cell*w+"px";cv.style.height=cell*h+"px";cv.width=cell*w*dpr;cv.height=cell*h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",()=>{if(S&&cv&&cv.isConnected){layout();draw()}});
function draw(){const{w,h,cells,pal:P}=S.pic,c=ctx;c.textAlign="center";c.textBaseline="middle";c.font="700 "+Math.max(7,Math.floor(cell*.52))+"px Barlow,system-ui,sans-serif";
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,n=cells[i],X=x*cell,Y=y*cell;
    if(S.filled[i]){c.fillStyle=P[n];c.fillRect(X,Y,cell,cell);continue}
    c.fillStyle=n===S.sel?"#cfdcff":(x+y)%2?"#f4f4f4":"#ececec";c.fillRect(X,Y,cell,cell);
    if(S.peek){c.globalAlpha=.28;c.fillStyle=P[n];c.fillRect(X,Y,cell,cell);c.globalAlpha=1}
    if(S.flash&&S.flash.i===i){c.fillStyle="rgba(226,65,46,.5)";c.fillRect(X,Y,cell,cell)}
    if(cell>=9){c.fillStyle=n===S.sel?"#1d3d85":"#8a8f98";c.fillText(n+1,X+cell/2,Y+cell/2+1)}}
  if(!S.done){c.strokeStyle="rgba(0,0,0,.07)";c.lineWidth=1;c.beginPath();for(let x=1;x<w;x++){c.moveTo(x*cell+.5,0);c.lineTo(x*cell+.5,h*cell)}for(let y=1;y<h;y++){c.moveTo(0,y*cell+.5);c.lineTo(w*cell,y*cell+.5)}c.stroke()}}
function cellAt(e){const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);if(x<0||y<0||x>=S.pic.w||y>=S.pic.h)return-1;return y*S.pic.w+x}
let tipT=0;
function touch(e,first){if(S.done||K.busy)return;const i=cellAt(e);if(i<0)return;paintAt(i,first)}
function paintAt(i,first){const n=S.pic.cells[i];if(S.filled[i])return;
  if(n!==S.sel){if(first){S.flash={i};draw();setTimeout(()=>{if(S)S.flash=null,draw()},250);
      const now=Date.now();if(now-tipT>1500){tipT=now;K.tip("That square is number "+(n+1)+". You have colour "+(S.sel+1)+".");if(K.age<=1)TS.say("That's a "+(n+1)+".")}}return}
  let got=0;if(S.tool==="fill"){const q=[i],{w,h,cells}=S.pic;S.filled[i]=1;got=1;while(q.length){const j=q.pop(),x=j%w,y=(j/w)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=w||Y>=h)continue;const k=Y*w+X;if(!S.filled[k]&&cells[k]===n){S.filled[k]=1;got++;q.push(k)}}}}
  else{S.filled[i]=1;got=1}
  if(first||S.tool==="fill")TS.music.fx("tap");
  if(!left(S.sel)){TS.music.fx("good");const nx=S.pic.pal.findIndex((_,j)=>left(j)>0);if(nx>=0){S.sel=nx;K.tip("Colour "+(S.sel+1)+" next!")}}
  pal();draw();if(isDone())finish()}
function persist(){if(!S)return;const str=S.filled.join("");
  if(S.n){const P=K.save.prog||(K.save.prog={});P[S.pic.key]=str;K.persist()}else MINE.saveProg(S.pic,str)}
function finish(){if(S.done)return;S.done=true;persist();draw();TS.music.fx("win");

  let t=0;const sweep=()=>{if(!S||!S.done||!cv.isConnected)return;t+=.04;draw();const W=S.pic.w*cell,H=S.pic.h*cell,x=(t*1.6-.3)*(W+H);
    const g=ctx.createLinearGradient(x-80,0,x,H);g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(.5,"rgba(255,255,255,.55)");g.addColorStop(1,"rgba(255,255,255,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  else{K.tip("🎉 Your picture is finished!");setTimeout(()=>MINE.open("🎉 You finished "+S.pic.name+"!"),1500)}}
/* Hint (after the maths question): fill in some squares of the current colour */
function hint(){if(!S||S.done)return;S.helps++;let n=0;S.pic.cells.forEach((c,i)=>{if(c===S.sel&&!S.filled[i]&&n<25){S.filled[i]=1;n++}});K.tip("✨ Magic paint! "+n+" squares of colour "+(S.sel+1)+".");
  if(!left(S.sel)){const nx=S.pic.pal.findIndex((_,j)=>left(j)>0);if(nx>=0)S.sel=nx}pal();draw();persist();if(isDone())finish()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
