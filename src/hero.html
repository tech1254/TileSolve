<!DOCTYPE html>
<html lang="en">
<head>
<!--HEAD:Hero Rush-->
<style>
.hr-wrap{position:relative;width:100%;max-width:1100px;flex:1;min-height:300px;display:flex;border-radius:16px;overflow:hidden}
.hr-cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:#7cc8ff}
.hr-btn{position:absolute;bottom:12px;width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(20,24,40,.45);color:#fff;
  font:700 30px var(--font-body);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer;padding:0}
.hr-btn.on{background:rgba(255,255,255,.45);transform:scale(.95)}
.hr-btn small{display:block;font-size:12px;letter-spacing:.05em;margin-top:-4px}
#hrL{left:12px}#hrR{left:102px}
#hrJ{right:12px;width:92px;height:92px;background:rgba(242,194,48,.75);color:#2b2100}
#hrP{right:116px;overflow:hidden}
#hrP .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(127,212,255,.55);pointer-events:none}
#hrP span{position:relative}
.hr-edit{position:absolute;top:10px;right:10px;border:0;border-radius:14px;background:rgba(20,24,40,.55);color:#fff;font:700 15px var(--font-body);padding:8px 12px;cursor:pointer}
@media (max-width:600px){.hr-btn{width:64px;height:64px;font-size:24px}#hrR{left:84px}#hrJ{width:76px;height:76px}#hrP{right:96px}}
/* hero maker */
.hm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,14,30,.7);padding:10px}
.hm[hidden]{display:none}
.hm-card{box-sizing:border-box;width:min(760px,98vw);max-height:96vh;overflow-y:auto;background:var(--panel);border-radius:22px;padding:14px;color:var(--ink,#fff);display:grid;gap:10px;
  grid-template-columns:240px 1fr;box-shadow:0 20px 50px rgba(0,0,0,.5)}
@media (max-width:640px){.hm-card{grid-template-columns:1fr}}
.hm-card h2{grid-column:1/-1;margin:0;font:400 clamp(24px,5vw,32px) var(--font-sign);color:var(--paint);text-align:center}
.hm-prev{display:grid;justify-items:center;gap:8px;align-content:start}
.hm-prev canvas{width:220px;height:220px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#9ad4ff,#3b6fd9)}
.hm-prev input{width:200px;box-sizing:border-box;font:700 20px var(--font-body);text-align:center;border-radius:12px;border:2px solid var(--lane);padding:8px;background:#fff;color:#1d2230}
.hm-opts{display:grid;gap:8px}
.hm-row b{display:block;font:700 15px var(--font-body);margin-bottom:4px;opacity:.85}
.hm-chips{display:flex;flex-wrap:wrap;gap:6px}
.hm-chips button{border:2px solid transparent;border-radius:12px;background:rgba(255,255,255,.1);color:inherit;font:700 14px var(--font-body);padding:6px 9px;cursor:pointer}
.hm-chips button.on{border-color:var(--paint);background:rgba(242,194,48,.2)}
.hm-chips .sw{width:32px;height:32px;padding:0;border-radius:50%;border:3px solid rgba(255,255,255,.3)}
.hm-chips .sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--paint)}
.hm-pow{font-size:13px;opacity:.8;margin-top:4px;min-height:1.2em}
.hm-go{grid-column:1/-1;justify-self:center;font:400 28px var(--font-sign);background:var(--good);color:#fff;border:0;border-radius:18px;padding:12px 40px;cursor:pointer}
/* story missions */
.ms{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(8,10,28,.78);padding:10px}
.ms[hidden]{display:none}
.ms-card{box-sizing:border-box;width:min(820px,98vw);max-height:96vh;overflow-y:auto;background:linear-gradient(160deg,#1d2552,#121733);border:3px solid #3b6fd9;border-radius:22px;padding:14px;color:#fff;
  display:grid;grid-template-columns:200px 1fr;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
@media (max-width:640px){.ms-card{grid-template-columns:1fr}.ms-side{display:flex!important;justify-content:center;gap:10px}.ms-side canvas{width:110px!important;height:110px!important}}
.ms-side{display:grid;gap:8px;justify-items:center;align-content:start}
.ms-side canvas{width:180px;height:180px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#2a3a7a,#121733)}
.ms-main{display:grid;gap:10px;align-content:start}
.ms-main h2{margin:0;font:400 clamp(22px,4.6vw,30px) var(--font-sign);color:#ffd23f}
.ms-story{margin:0;font:600 clamp(15px,3.4vw,18px)/1.4 var(--font-body);color:#d8e2ff}
.ms-dots{display:flex;gap:8px}.ms-dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.2)}.ms-dots i.d{background:#43e04f}.ms-dots i.c{background:#fff;box-shadow:0 0 0 3px #ffd23f}
.ms-q{background:rgba(255,255,255,.08);border-radius:16px;padding:12px;font:700 clamp(18px,4vw,24px)/1.35 var(--font-body)}
.ms-q .eq{display:block;margin-top:6px;font:400 clamp(26px,6vw,38px) var(--font-sign);color:#ffd23f;letter-spacing:.03em}
.ms-ans{display:flex;align-items:center;gap:10px}
.ms-ans output{flex:1;min-height:58px;border-radius:14px;background:#fff;color:#1d2230;font:400 38px var(--font-sign);display:grid;place-items:center}
.ms-ans output.bad{animation:msShake .4s;background:#ffd6d6}.ms-ans output.good{background:#c9f7cf}
@keyframes msShake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ms-pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ms-pad button{height:54px;border:0;border-radius:12px;background:#2f3c78;color:#fff;font:400 26px var(--font-sign);cursor:pointer;touch-action:manipulation}
.ms-pad button:active{transform:scale(.95)}
.ms-pad .go{grid-column:span 2;background:#43a047;font-size:22px}
.ms-pad .del{background:#6b4a8a}
.ms-help{min-height:1.3em;margin:0;font:700 16px var(--font-body);color:#ffcf6b}
.ms-btn{justify-self:start;font:400 26px var(--font-sign);background:#43a047;color:#fff;border:0;border-radius:16px;padding:10px 30px;cursor:pointer}
.ms-eng{font:700 14px var(--font-body);color:#9fb4ff;text-align:center}
</style>
</head>
<body>
<!--KIT-->
<script>
(()=>{
/* Hero Rush: a fast running game starring a superhero the player designs (animal, colours, cape, emblem, name, superpower).
   Run, jump, bounce on springs, hit speed pads and race round loop-the-loops; collect sparks; bop baddies by jumping on them
   (spiky beetles can't be bopped: jump over them, or smash them with Turbo Dash). Reach the finish arch.
   6 worlds x 4 acts; act 4 of each world is a boss: wait for it to land and get dizzy, then jump on its head.
   3 hearts per act, checkpoint flags along the way. Levels are generated from the level's seed, so each one is the same every time. */
let K,S=null;
const LEVELS=24,GRAV=1900,JUMP=780,RUNACC=1150,AIRACC=1000,RUNMAX=540,PADV=1000,LOOPV=430;
const ZONES=[
  {name:"Meadow Run",sky:["#6ec3ff","#d9f2ff"],far:"#9bd78f",mid:"#5fb55c",ground:"#7a5230",top:"#4caf50",accent:"#ff6fb5",boss:"Big Gloop",bc:"#5ccf5c"},
  {name:"Canyon Rush",sky:["#ffa75e","#ffe3bd"],far:"#e09a63",mid:"#c46e3e",ground:"#8a4b2a",top:"#dd8a40",accent:"#ffd166",boss:"Boulder Buddy",bc:"#a39684"},
  {name:"Neon City",sky:["#120a2b","#3d2170"],far:"#2b2058",mid:"#40307e",ground:"#221d38",top:"#00e5ff",accent:"#ff4fd8",boss:"Glitch Cube",bc:"#ff4fd8",night:1},
  {name:"Frosty Peaks",sky:["#94d2ff","#eef9ff"],far:"#d2e7f6",mid:"#a8cbe4",ground:"#6c8ca6",top:"#f6fcff",accent:"#7fd4ff",boss:"Snow Brute",bc:"#eaf5ff",ice:1},
  {name:"Volcano Dash",sky:["#2e0b07","#a3321a"],far:"#5c1d12",mid:"#7c2b17",ground:"#3a1d14",top:"#6a3020",accent:"#ff8a1f",boss:"Magma Blob",bc:"#ff6a2a",lava:1,night:1},
  {name:"Sky Castle",sky:["#5aa9ff","#ffffff"],far:"#ffffff",mid:"#e3eeff",ground:"#b9a27a",top:"#ffe08a",accent:"#ffd84a",boss:"Storm Cloud",bc:"#7d8aa8",cloud:1}];
const zi=n=>Math.floor((n-1)/4),zoneOf=n=>ZONES[zi(n)],isBoss=n=>n%4===0;

/* ---------- the hero ---------- */
const ANIMALS=[["fox","Fox"],["cat","Cat"],["dog","Dog"],["bunny","Bunny"],["bear","Bear"],["tiger","Tiger"],["panda","Panda"],["wolf","Wolf"],["dragon","Dragon"],["penguin","Penguin"],["owl","Owl"],["mouse","Mouse"]];
const COLS=["#e2412e","#f08a24","#f2c230","#43a047","#1e9e8a","#3b6fd9","#8f5bd6","#e06aa6","#8b5a2b","#9aa3ad","#2b2b2b","#fafafa"];
const POWERS=[["turbo","Turbo Dash","💨","Zoom super fast and smash through anything!"],["double","Double Jump","🦘","Jump again in the air!"],["glide","Glide","🪂","Hold jump to float down slowly."],
  ["magnet","Spark Magnet","🧲","Sparks fly to you. Tap power to pull in every spark nearby!"],["shield","Bubble Shield","🫧","A bubble blocks a hit, then comes back."]];
const EMBLEMS=["⚡","★","♥","✦","☀","☾","♪","✚","letter"];
const DEF={name:"Hero",animal:"fox",body:"#f08a24",shoes:"#e2412e",cape:"#3b6fd9",emblem:"⚡",power:"turbo"};
let HERO=null;
function mix(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),A=p(a),B=p(b);return"rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")"}
/* draws the hero with feet at (0,0) facing right. st: {run (phase), air, vy, speed, hurt, t} */
function drawHero(c,h,st){const b=h.body,dark=mix(b,"#000000",.35),light=mix(b,"#ffffff",.6),a=h.animal,t=st.t||0,run=st.run||0,sp=Math.min(1,(st.speed||0)/540);
  const outline=()=>{c.strokeStyle="rgba(0,0,0,.45)";c.lineWidth=2;c.stroke()};
  c.save();if(st.hurt&&Math.floor(t*20)%2)c.globalAlpha=.4;
  // speed lines
  if(sp>.75&&!st.air){c.strokeStyle="rgba(255,255,255,.7)";c.lineWidth=2.5;for(let k=0;k<3;k++){const y=-14-k*14,L=18+30*sp+((t*60+k*7)%10);c.beginPath();c.moveTo(-26-L,y);c.lineTo(-26,y);c.stroke()}}
  // cape
  if(h.cape&&h.cape!=="none"){const wv=Math.sin(t*14)*4*(.4+sp),fl=8+22*sp+(st.air?10:0);c.fillStyle=h.cape;c.beginPath();c.moveTo(-6,-40);c.quadraticCurveTo(-18-fl*.5,-30+wv,-14-fl,-12+wv);
    c.lineTo(-6-fl*.6,-8-wv);c.quadraticCurveTo(-8,-20,-2,-38);c.closePath();c.fill();outline()}
  // tail
  c.fillStyle=b;c.strokeStyle="rgba(0,0,0,.45)";c.lineWidth=2;const tw=Math.sin(t*10)*3;
  if(a==="fox"||a==="wolf"){c.beginPath();c.ellipse(-20,-20+tw,14,7,-.5,0,7);c.fill();c.stroke();c.fillStyle=a==="fox"?"#fff":light;c.beginPath();c.ellipse(-30,-25+tw,5,4,-.5,0,7);c.fill()}
  else if(a==="cat"||a==="tiger"||a==="mouse"){c.beginPath();c.moveTo(-10,-18);c.quadraticCurveTo(-26,-14+tw,-24,-34+tw);c.lineWidth=a==="mouse"?2.5:4.5;c.strokeStyle=a==="mouse"?"#e8a0a8":b;c.stroke()}
  else if(a==="bunny"||a==="bear"||a==="panda"){c.fillStyle=a==="bunny"?"#fff":a==="panda"?"#222":b;c.beginPath();c.arc(-13,-20,5,0,7);c.fill()}
  else if(a==="dog"){c.beginPath();c.moveTo(-10,-22);c.lineTo(-22,-30+tw);c.lineWidth=5;c.strokeStyle=b;c.stroke()}
  else if(a==="dragon"){c.fillStyle=b;c.beginPath();c.moveTo(-8,-14);c.quadraticCurveTo(-26,-8,-34,-18+tw);c.lineTo(-24,-16);c.quadraticCurveTo(-16,-18,-8,-22);c.fill();c.stroke();
    c.fillStyle=h.shoes;c.beginPath();c.moveTo(-34,-18+tw);c.lineTo(-40,-24+tw);c.lineTo(-36,-12+tw);c.fill()}
  else if(a==="owl"){c.fillStyle=dark;c.beginPath();c.moveTo(-10,-14);c.lineTo(-20,-10);c.lineTo(-18,-18);c.fill()}
  // legs
  const legs=st.air?[[.9,-.4],[-.6,.5]]:[[Math.sin(run)*.9,0],[Math.sin(run+Math.PI)*.9,0]];
  legs.forEach(([ang,k],j)=>{c.save();c.translate(j?-2:3,-16);c.rotate(ang);c.fillStyle=j?dark:b;c.fillRect(-3,0,6,12);c.fillStyle=h.shoes;c.beginPath();c.ellipse(4,14,8,4.5,0,0,7);c.fill();c.strokeStyle="rgba(0,0,0,.45)";c.lineWidth=1.5;c.stroke();
    c.fillStyle="#fff";c.fillRect(-2,12,9,2);c.restore()});
  // body
  c.fillStyle=a==="panda"?"#fafafa":b;c.beginPath();c.ellipse(1,-27,12,14,0,0,7);c.fill();outline();
  c.fillStyle=a==="penguin"||a==="owl"?"#fff":light;c.beginPath();c.ellipse(5,-25,7,10,0,0,7);c.fill();
  if(a==="tiger"){c.strokeStyle="#2b2b2b";c.lineWidth=2;for(const y of [-34,-26,-18]){c.beginPath();c.moveTo(-10,y);c.lineTo(-4,y+2);c.stroke()}}
  // emblem
  const em=h.emblem==="letter"?(h.name||"H").trim().charAt(0).toUpperCase()||"H":h.emblem;c.fillStyle=h.shoes;c.font="bold 13px system-ui";c.textAlign="center";c.textBaseline="middle";c.fillText(em,5,-26);
  // arm
  c.save();c.translate(4,-33);c.rotate(st.air?-2.2:Math.sin(run+Math.PI)*.8+.3);c.fillStyle=a==="panda"?"#222":b;c.fillRect(-2.5,0,5,13);c.fillStyle="#fff";c.beginPath();c.arc(0,14,4,0,7);c.fill();c.restore();
  // head
  c.save();c.translate(4,-48);const hb=a==="panda"?"#fafafa":b;
  c.fillStyle=hb;c.strokeStyle="rgba(0,0,0,.45)";c.lineWidth=2;
  const ear=(x,y,w,hh,rot,inner)=>{c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=a==="panda"?"#222":b;c.beginPath();c.moveTo(-w,0);c.lineTo(0,-hh);c.lineTo(w,0);c.closePath();c.fill();c.stroke();
    if(inner){c.fillStyle=inner;c.beginPath();c.moveTo(-w*.5,-2);c.lineTo(0,-hh*.65);c.lineTo(w*.5,-2);c.fill()}c.restore()};
  if(a==="fox"||a==="cat"||a==="tiger"||a==="wolf"){ear(-7,-9,6,a==="fox"||a==="wolf"?15:11,-.25,"#f6c1c8");ear(5,-11,6,a==="fox"||a==="wolf"?15:11,.15,"#f6c1c8")}
  if(a==="bunny"){for(const [x,r] of [[-6,-.2],[4,.15]]){c.save();c.translate(x,-10);c.rotate(r);c.fillStyle=b;c.beginPath();c.ellipse(0,-12,4.5,13,0,0,7);c.fill();c.stroke();c.fillStyle="#f6c1c8";c.beginPath();c.ellipse(0,-12,2,9,0,0,7);c.fill();c.restore()}}
  if(a==="bear"||a==="panda"||a==="mouse"){const r=a==="mouse"?9:5.5;for(const x of [-9,7]){c.fillStyle=a==="panda"?"#222":b;c.beginPath();c.arc(x,-11,r,0,7);c.fill();c.stroke();if(a==="mouse"){c.fillStyle="#f6c1c8";c.beginPath();c.arc(x,-11,r*.55,0,7);c.fill()}}}
  if(a==="dog"){c.fillStyle=dark;c.beginPath();c.ellipse(-9,-2,5,10,.3,0,7);c.fill()}
  if(a==="dragon"){c.fillStyle="#fff3c4";for(const x of [-6,4]){c.beginPath();c.moveTo(x-3,-11);c.lineTo(x-6,-22);c.lineTo(x+3,-12);c.fill();c.stroke()}}
  if(a==="owl"){ear(-8,-10,4,8,-.4,null);ear(6,-11,4,8,.4,null)}
  c.fillStyle=hb;c.beginPath();c.arc(0,0,14,0,7);c.fill();c.stroke();
  if(a==="dog"){c.fillStyle=dark;c.beginPath();c.ellipse(-9,-1,4,9,.3,0,7);c.fill()}
  if(a==="tiger"){c.strokeStyle="#2b2b2b";c.lineWidth=2;c.beginPath();c.moveTo(-4,-13);c.lineTo(-2,-7);c.moveTo(1,-14);c.lineTo(1,-8);c.stroke()}
  // muzzle
  if(a==="penguin"||a==="owl"){c.fillStyle="#fff";c.beginPath();c.ellipse(4,2,9,10,0,0,7);c.fill();c.fillStyle="#f2a33a";c.beginPath();c.moveTo(12,1);c.lineTo(20,4);c.lineTo(12,7);c.fill()}
  else if(a==="fox"||a==="wolf"||a==="dog"||a==="dragon"){c.fillStyle=a==="fox"?"#fff":light;c.beginPath();c.moveTo(4,0);c.quadraticCurveTo(20,0,21,6);c.quadraticCurveTo(12,12,2,9);c.fill();
    c.fillStyle="#222";c.beginPath();c.arc(20,5,2.6,0,7);c.fill()}
  else{c.fillStyle=a==="bear"?light:"#fff";c.beginPath();c.ellipse(9,6,7,5.5,0,0,7);c.fill();c.fillStyle="#222";c.beginPath();c.arc(14,4.5,2.2,0,7);c.fill();
    if(a==="cat"||a==="tiger"||a==="mouse"||a==="bunny"){c.strokeStyle="rgba(0,0,0,.5)";c.lineWidth=1;c.beginPath();c.moveTo(14,7);c.lineTo(24,6);c.moveTo(14,8);c.lineTo(23,11);c.stroke()}}
  // eye
  if(a==="panda"){c.fillStyle="#222";c.beginPath();c.ellipse(5,-3,5,6,-.4,0,7);c.fill()}
  const ex=a==="owl"?2:5,er=a==="owl"?6:4.2;c.fillStyle="#fff";c.beginPath();c.ellipse(ex,-3,er,er+1.2,0,0,7);c.fill();if(a==="owl"){c.beginPath();c.ellipse(-6,-3,er,er+1.2,0,0,7);c.fill()}
  c.fillStyle="#1d2230";c.beginPath();c.arc(ex+1.6,-2.5,er*.55,0,7);c.fill();if(a==="owl"){c.beginPath();c.arc(-4.4,-2.5,er*.55,0,7);c.fill()}
  c.fillStyle="#fff";c.beginPath();c.arc(ex+2.4,-4,1.1,0,7);c.fill();
  // mask (superhero!)
  c.fillStyle=h.cape&&h.cape!=="none"?h.cape:h.shoes;c.globalAlpha*=.9;c.beginPath();c.moveTo(-12,-6);c.quadraticCurveTo(4,-11,13,-6);c.lineTo(12,-1);c.quadraticCurveTo(10,1,8,-1);
  c.quadraticCurveTo(4,-4,1,-1);c.quadraticCurveTo(-4,0,-12,-1);c.closePath();c.fill();c.globalAlpha=st.hurt&&Math.floor(t*20)%2?.4:1;
  c.fillStyle="#fff";c.beginPath();c.ellipse(ex,-3,er*.75,er*.85,0,0,7);c.fill();c.fillStyle="#1d2230";c.beginPath();c.arc(ex+1.6,-2.5,er*.5,0,7);c.fill();
  c.restore();c.restore()}

/* ---------- sound ---------- */
let AC=null;
function ac(){if(TS.music.muted)return null;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
function tone(f,d,type,vol,slide,delay){const a=ac();if(!a)return;const t=a.currentTime+.01+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
let sparkN=0;
const SND={jump:()=>tone(330,.18,"square",.05,660),spark:()=>{sparkN=(sparkN+1)%2;tone(sparkN?1318:1568,.16,"triangle",.08)},spring:()=>tone(180,.35,"sine",.14,900),
  bop:()=>{tone(220,.12,"square",.08,110);tone(660,.15,"triangle",.07,0,.05)},hurt:()=>tone(400,.4,"sawtooth",.08,90),dash:()=>tone(120,.5,"sawtooth",.06,700),
  pad:()=>tone(500,.3,"square",.05,1400),flag:()=>{tone(784,.15,"triangle",.09);tone(1046,.25,"triangle",.09,0,.12)},boss:()=>{tone(90,.5,"square",.1,50)},
  shield:()=>tone(900,.3,"sine",.08,300)};

/* ---------- level building ---------- */
const SEG=20;
function build(n){const r=K.rng(n),Z=zoneOf(n),ri=(a,b)=>a+Math.floor(r()*(b-a+1)),d=(n-1)%4+zi(n)*.6;
  const L={gy:[],plats:[],springs:[],pads:[],loops:[],sparks:[],foes:[],spikes:[],flags:[],end:0,Z,boss:null};let y=380;
  const flat=(len)=>{for(let k=0;k<len/SEG;k++)L.gy.push(y)};
  const slope=(len,dy)=>{const n0=len/SEG,y0=y;for(let k=1;k<=n0;k++){L.gy.push(y0+dy*(1-Math.cos(Math.PI*k/n0))/2)}y=y0+dy};
  const X=()=>L.gy.length*SEG;

    '<div class="hm-row"><b>Emblem</b>'+chips("emblem",EMBLEMS,e=>'<button type="button" data-v="'+e+'" class="'+(h.emblem===e?"on":"")+'">'+(e==="letter"?"My letter":e)+"</button>")+"</div>"+
    '<div class="hm-row"><b>Superpower</b>'+chips("power",POWERS,p=>'<button type="button" data-v="'+p[0]+'" class="'+(h.power===p[0]?"on":"")+'">'+p[2]+" "+p[1]+"</button>")+'<div class="hm-pow" id="hmPow"></div></div></div>'+
    '<button class="hm-go" id="hmGo" type="button">'+(first?"Let's go! ⚡":"Done")+"</button></div>";
  hm.hidden=false;const pc=hm.querySelector("canvas"),px=pc.getContext("2d");let t0=performance.now(),alive=true;
  const pow=()=>{const p=POWERS.find(p=>p[0]===h.power);hm.querySelector("#hmPow").textContent=p[3]};pow();
  (function anim(){if(!alive||hm.hidden)return;const t=(performance.now()-t0)/1000;px.setTransform(1,0,0,1,0,0);px.clearRect(0,0,440,440);px.setTransform(4,0,0,4,220,350);
    px.fillStyle="rgba(0,0,0,.2)";px.beginPath();px.ellipse(0,0,24,4,0,0,7);px.fill();drawHero(px,h,{run:t*12,speed:300,t});requestAnimationFrame(anim)})();
  hm.querySelectorAll(".hm-chips").forEach(row=>row.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;h[row.dataset.k]=b.dataset.v;row.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    if(row.dataset.k==="power"){pow();TS.say(POWERS.find(p=>p[0]===h.power)[1])}if(row.dataset.k==="animal")TS.say(b.textContent)}));
  hm.querySelector("#hmName").oninput=e=>{h.name=e.target.value};
  hm.querySelector("#hmGo").onclick=()=>{h.name=(h.name||"").trim()||"Hero";K.save.hero=h;K.persist();HERO=Object.assign({},h);alive=false;hm.hidden=true;
    TS.say("Go, "+h.name+"!");if(S){S.paused=false;K.load(K.level)}}}

/* ---------- the story: Professor Muddle has scrambled the Number Engines that keep the six worlds running ----------
   Winning a level for the first time unlocks a mission: 3 maths problems (on a number pad) to fix one part of that world's engine.
   Acts 1-3 fix the gears, the code and the power core; after the boss, the hero restarts the engine and the world is saved.
   Problems are word problems in the world's own setting, matched to the player's grade and getting harder world by world;
   a wrong answer shows how to work it out and gives a fresh problem. (These missions replace the usual maths checkpoints.) */
const WORLD=[
  {thing:["flowers","bees","sunflowers","seeds"],intro:"The Meadow Number Engine waters every flower. Professor Muddle scrambled it, and the meadow is wilting!"},
  {thing:["planks","rocks","cactus flowers","bridge bolts"],intro:"The Canyon Number Engine holds up all the rope bridges. Muddle scrambled it, and the bridges are wobbling!"},
  {thing:["lights","robots","neon signs","batteries"],intro:"The Neon Number Engine lights up the whole city. Muddle scrambled it, and the lights are flickering out!"},
  {thing:["snowballs","penguins","icicles","snowflakes"],intro:"The Frost Number Engine keeps the mountains safe from avalanches. Muddle scrambled it, and the snow is rumbling!"},
  {thing:["lava rocks","fire crystals","steam vents","volcano gems"],intro:"The Volcano Number Engine keeps the lava calm. Muddle scrambled it, and the volcano is about to blow!"},
  {thing:["clouds","sky keys","castle gears","star lanterns"],intro:"Professor Muddle's hideout! The Sky Number Engine holds all the other engines together. Fix it and stop Muddle for good!"}];
const PARTS=[["⚙️","Fix the gears"],["🔐","Crack the code"],["🔋","Charge the power core"],["🚀","Restart the engine!"]];
function mathQ(age,w,rr){const ri=(a,b)=>a+Math.floor(rr()*(b-a+1)),pk=a=>a[Math.floor(rr()*a.length)],T=WORLD[w].thing,t=pk(T),u=Math.min(5,w),hard=u>=3;
  const Q=(text,eq,ans,how)=>({text,eq,ans,how});
  if(age<=0){const k=pk(["add","sub","miss"]),mx=hard?10:6+u;
    if(k==="add"){const a=ri(1,mx-1),b=ri(1,Math.min(mx-a,9));return Q("Muddle hid "+a+" "+t+" in one spot and "+b+" in another. How many "+t+" did you find?",a+" + "+b+" = ?",a+b,"Count on from "+a+": "+Array.from({length:b},(_,i)=>a+i+1).join(", ")+".")}
    if(k==="sub"){const c=ri(3,mx),b=ri(1,c-1);return Q("There were "+c+" "+t+". Muddle zapped "+b+" of them. How many are left?",c+" − "+b+" = ?",c-b,"Count back "+b+" from "+c+".")}
    const a=ri(1,mx-2),c=ri(a+1,mx);return Q("The engine needs "+c+" "+t+". It has "+a+". How many more does it need?",a+" + ? = "+c,c-a,"Count up from "+a+" to "+c+".")}
  if(age===1){const k=pk(["add","sub","miss","dbl"]),mx=hard?20:10+u*2;
    if(k==="add"){const a=ri(3,mx-2),b=ri(2,Math.min(9,mx-a));return Q("You collected "+a+" "+t+", then "+b+" more. How many altogether?",a+" + "+b+" = ?",a+b,"Make a ten: "+a+" + "+b+" → count on "+b+" from "+a+".")}
    if(k==="sub"){const c=ri(8,mx),b=ri(2,Math.min(9,c-1));return Q("Muddle scrambled "+b+" of the "+c+" "+t+". How many still work?",c+" − "+b+" = ?",c-b,"Think: "+b+" + ? = "+c+".")}
    if(k==="dbl"){const a=ri(2,hard?10:6);return Q("Each side of the engine needs "+a+" "+t+". There are 2 sides. How many in all?",a+" + "+a+" = ?",a*2,"Double "+a+" is "+(a*2)+".")}
    const a=ri(3,mx-3),c=ri(a+2,mx);return Q("The code is "+c+". You have "+a+". What number do you add?",a+" + ? = "+c,c-a,"Count up from "+a+" to "+c+": that's "+(c-a)+".")}
  if(age===2){const k=pk(["add","sub","skip","miss"]),mx=hard?100:50+u*10;
    if(k==="add"){const a=ri(11,mx-20),b=ri(5,Math.min(39,mx-a));return Q("The engine has "+a+" "+t+". You bring "+b+" more. How many now?",a+" + "+b+" = ?",a+b,"Add the tens, then the ones: "+(Math.floor(a/10)*10+Math.floor(b/10)*10)+" + "+(a%10+b%10)+".")}
    if(k==="sub"){const c=ri(30,mx),b=ri(5,Math.min(29,c-5));return Q("There were "+c+" "+t+". Muddle took "+b+". How many are left?",c+" − "+b+" = ?",c-b,"Take away the tens, then the ones. Check: "+(c-b)+" + "+b+" = "+c+".")}
    if(k==="skip"){const st=pk([2,5,10]),a=ri(1,6)*st,seq=[a,a+st,a+2*st,a+3*st];return Q("Muddle's lock counts by "+st+"s. What number comes next?",seq.join(", ")+", ?",a+4*st,"Add "+st+" to "+seq[3]+".")}
    const a=ri(10,mx-15),c=ri(a+5,mx);return Q("The engine needs "+c+" "+t+". It has "+a+". How many more?",a+" + ? = "+c,c-a,"Count up from "+a+" to the next ten, then to "+c+".")}
  if(age===3){const k=pk(hard?["mul","mul","div","add3"]:["mul","div","add3","mul"]);
    if(k==="mul"){const a=ri(2,hard?10:6+u),b=ri(2,hard?10:5+u);return Q("The engine has "+a+" rows of "+t+", with "+b+" in each row. How many "+t+"?",a+" × "+b+" = ?",a*b,a+" groups of "+b+": "+Array.from({length:a},()=>b).join(" + ")+" = "+(a*b)+".")}
    if(k==="div"){const b=ri(2,hard?9:6),q=ri(2,hard?10:6);return Q("Share "+(b*q)+" "+t+" equally into "+b+" engine slots. How many in each slot?",(b*q)+" ÷ "+b+" = ?",q,"Think: "+b+" × ? = "+(b*q)+".")}
    const a=ri(120,hard?700:450),b=ri(30,hard?280:150),add=rr()<.5;return add?Q("The engine used "+a+" "+t+" on Monday and "+b+" on Tuesday. How many in total?",a+" + "+b+" = ?",a+b,"Add hundreds, tens and ones: line up the places."):
      Q("Muddle had "+(a+b)+" "+t+". He dropped "+b+". How many does he have now?",(a+b)+" − "+b+" = ?",a,"Subtract ones, tens, then hundreds. Check by adding back.")}
  if(age===4){const k=pk(["mul2","div","frac","area"]);
    if(k==="mul2"){const a=ri(12,hard?99:45),b=ri(3,9);return Q("Each engine wheel has "+a+" "+t+". There are "+b+" wheels. How many "+t+"?",a+" × "+b+" = ?",a*b,"Split it: "+Math.floor(a/10)*10+" × "+b+" + "+(a%10)+" × "+b+".")}
    if(k==="div"){const b=ri(3,9),q=ri(11,hard?40:20);return Q("Pack "+(b*q)+" "+t+" into "+b+" equal boxes. How many in each box?",(b*q)+" ÷ "+b+" = ?",q,"Think: "+b+" × ? = "+(b*q)+". Try "+b+" × 10 first.")}
    if(k==="frac"){const d=pk([2,3,4,5,10]),n=ri(1,d-1),tot=d*ri(2,hard?12:6);return Q("Muddle stole "+n+"/"+d+" of the "+tot+" "+t+". How many did he steal?",n+"/"+d+" of "+tot+" = ?",tot/d*n,"1/"+d+" of "+tot+" is "+(tot/d)+", so "+n+"/"+d+" is "+n+" × "+(tot/d)+".")}
    const a=ri(3,hard?15:9),b=ri(3,hard?12:8);return Q("A rectangle-shaped engine panel is "+a+" squares long and "+b+" squares wide. How many squares cover it?",a+" × "+b+" = ?",a*b,"Area = length × width.")}
  const k=pk(["mul22","div2","frac","order"]);
  if(k==="mul22"){const a=ri(12,hard?60:30),b=ri(11,hard?40:20);return Q("The Sky Engine has "+a+" gears, each with "+b+" teeth. How many teeth?",a+" × "+b+" = ?",a*b,a+" × "+Math.floor(b/10)*10+" + "+a+" × "+(b%10)+".")}
  if(k==="div2"){const b=ri(11,25),q=ri(6,hard?40:20);return Q("Share "+(b*q)+" "+t+" between "+b+" robots. How many each?",(b*q)+" ÷ "+b+" = ?",q,"Estimate: "+b+" × 10 = "+(b*10)+", then adjust.")}
  if(k==="frac"){const d=pk([3,4,5,6,8,10]),n=ri(2,d-1),tot=d*ri(4,15);return Q("The engine needs "+n+"/"+d+" of the "+tot+" "+t+". How many is that?",n+"/"+d+" of "+tot+" = ?",tot/d*n,tot+" ÷ "+d+" = "+(tot/d)+", then × "+n+".")}
  const a=ri(2,9),b=ri(2,9),c=ri(2,12);return Q("Crack Muddle's code: do the multiplying first!",c+" + "+a+" × "+b+" = ?",c+a*b,"Multiply first: "+a+" × "+b+" = "+(a*b)+", then add "+c+".")}
const first=n=>!(((K.save.grades[K.age]||{}).stars||{})[n]);
let ms=null;
function engineArt(c,w,parts,t){const x=c.getContext("2d"),W=c.width;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,W);x.translate(W/2,W/2);const k=W/180;x.scale(k,k);
  const on=parts>=4;x.rotate(on?t*1.5:Math.sin(t*3)*.05);
  for(let i=0;i<4;i++){x.save();x.rotate(i*Math.PI/2);x.fillStyle=i<parts?["#ffd23f","#43e04f","#00e5ff","#ff6fb5"][i]:"#3a4370";x.beginPath();x.moveTo(0,0);x.arc(0,0,62,-Math.PI/2+.06,-.06);x.closePath();x.fill();x.restore()}
  x.fillStyle="#9aa3c7";for(let i=0;i<12;i++){x.save();x.rotate(i*Math.PI/6);x.fillRect(-7,-76,14,16);x.restore()}
  x.strokeStyle="#9aa3c7";x.lineWidth=6;x.beginPath();x.arc(0,0,64,0,7);x.stroke();x.fillStyle="#121733";x.beginPath();x.arc(0,0,20,0,7);x.fill();
  x.fillStyle=on?"#ffd23f":"#9aa3c7";x.font="bold 18px system-ui";x.textAlign="center";x.textBaseline="middle";x.fillText(on?"ON":parts+"/4",0,1)}
function mission(n,done){const w=zi(n),part=isBoss(n)?3:(n-1)%4,P=PARTS[part],eng=(K.save.eng=K.save.eng||{}),have=eng[w]||0,need=3;let got=0,miss=0,q=null,entry="",lock=false;
  const rr=Math.random,me=S,age=Math.max(0,Math.min(5,K.age-1));
  if(!ms){ms=document.createElement("div");ms.className="ms";document.body.appendChild(ms)}
  const story=(n===1?"Professor Muddle has scrambled the Number Engines that keep the six worlds running! Only a hero who is fast AND smart can fix them. ":"")+
    (part===0?WORLD[w].intro+" ":"")+(part===3?"You beat "+ZONES[w].boss+"! Now restart the engine to save "+ZONES[w].name+"!":"Solve "+need+" problems to "+P[1].toLowerCase()+".");
  ms.innerHTML='<div class="ms-card"><div class="ms-side"><canvas id="msHero" width="360" height="360"></canvas><canvas id="msEng" width="360" height="360"></canvas><div class="ms-eng">'+ZONES[w].name+' Number Engine</div></div>'+
    '<div class="ms-main"><h2>'+P[0]+" Mission: "+P[1]+'</h2><p class="ms-story">'+story+'</p><div class="ms-dots" id="msDots"></div><div class="ms-q" id="msQ"></div>'+
    '<div class="ms-ans"><output id="msOut"></output></div><div class="ms-pad" id="msPad">'+[1,2,3,4,5,6,7,8,9,0].map(d=>'<button type="button" data-d="'+d+'">'+d+"</button>").join("")+
    '<button type="button" class="del" data-d="del" aria-label="Delete">⌫</button><button type="button" class="go" data-d="go">Fix it! ⚡</button></div><p class="ms-help" id="msHelp"></p></div></div>';
  ms.hidden=false;const $m=id=>ms.querySelector("#"+id);
  const hc=$m("msHero"),ec=$m("msEng");let alive=true,t0=performance.now(),shown=have;
  (function anim(){if(!alive||ms.hidden)return;const t=(performance.now()-t0)/1000,x=hc.getContext("2d");x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,360,360);x.setTransform(3.4,0,0,3.4,180,300);
    drawHero(x,HERO,{run:t*3,speed:0,t});engineArt(ec,w,shown,t);requestAnimationFrame(anim)})();
  TS.say((n===1?"Professor Muddle has scrambled the Number Engines! ":"")+(part===0?WORLD[w].intro:"")+" "+P[1]+"!");
  const dots=()=>{$m("msDots").innerHTML=Array.from({length:need},(_,i)=>'<i class="'+(i<got?"d":i===got?"c":"")+'"></i>').join("")};
  const next=()=>{q=mathQ(age,w,rr);q.t0=Date.now();entry="";lock=false;$m("msOut").textContent="";$m("msOut").className="";$m("msQ").innerHTML=q.text+'<span class="eq">'+q.eq+"</span>";dots();if(alive)TS.sayNext(q.text)};
  const submit=()=>{if(lock||entry==="")return;const o=$m("msOut");
    const logM=ok=>{try{TS.report.log({t:"math",game:"hero",kind:"mission",mlevel:w,q:q.eq.slice(0,40),correct:ok?1:0,tries:1,ms:Date.now()-q.t0})}catch(e){}};
    if(+entry===q.ans){logM(true);lock=true;got++;o.className="good";SND.flag();$m("msHelp").textContent=U8(["Yes!","Correct!","Brilliant!","You got it!","Super smart!"]);dots();
      if(got>=need){setTimeout(()=>finishMission(),700)}else setTimeout(()=>{TS.talk.hush();next()},900)}
    else{logM(false);miss++;o.className="bad";SND.hurt();const how=q.how;$m("msHelp").textContent="Not quite: the answer is "+q.ans+". "+how+" Try a new one!";TS.say("Not quite. The answer is "+q.ans+". "+how);lock=true;setTimeout(()=>{if(alive){next();$m("msHelp").textContent="Here's a new one. You can do it!"}},3800)}};
  const finishMission=()=>{eng[w]=Math.max(have,part+1);K.persist();shown=eng[w];const saved=part===3;
    $m("msQ").innerHTML=saved?"🎉 <b>"+ZONES[w].name+" is saved!</b> The Number Engine is running again"+(w===5?" and Professor Muddle's scrambler is broken. "+HERO.name+" saved all six worlds!":"! Next stop: "+ZONES[w+1].name+"."):
      "⚡ <b>"+P[1]+": done!</b> The engine is "+(part+1)+"/4 fixed.";
    $m("msPad").hidden=true;$m("msOut").parentNode.hidden=true;$m("msHelp").textContent=miss?"":"Perfect mission: no mistakes!";
    TS.say(saved?ZONES[w].name+" is saved!"+(w===5?" You saved all six worlds!":""):"Mission complete!");TS.music.fx("win");
    const b=document.createElement("button");b.className="ms-btn";b.type="button";b.textContent=saved?"Hooray! ▶":"Keep going! ▶";$m("msQ").after(b);
    b.onclick=()=>{alive=false;ms.hidden=true;if(S===me)done(miss)}};
  $m("msPad").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||lock)return;const d=b.dataset.d;
    if(d==="go")return submit();if(d==="del")entry=entry.slice(0,-1);else if(entry.length<6)entry+=d;$m("msOut").textContent=entry;$m("msOut").className=""});
  ms.onkeydown=null;keyM=e=>{if(ms.hidden)return;if(/^[0-9]$/.test(e.key)){$m("msPad").querySelector('[data-d="'+e.key+'"]').click()}else if(e.key==="Backspace")$m("msPad").querySelector('[data-d="del"]').click();else if(e.key==="Enter")submit()};
  next();window.__mission={get q(){return q},answer(v){entry=String(v);submit()},get got(){return got},get open(){return !ms.hidden}}}
let keyM=null;addEventListener("keydown",e=>{if(keyM&&ms&&!ms.hidden)keyM(e)});
const U8=a=>a[Math.floor(Math.random()*a.length)];

/* Hint: a super snack: one extra heart (and a bubble shield) for this act */
function hint(){if(!S||S.done)return;S.hearts=Math.min(5,S.hearts+1);S.shield=1;S.shT=0;banner("+1 HEART!");K.tip("💪 A super snack: an extra heart and a bubble shield for this act!")}
K=TS_KIT({id:"hero",name:"Hero Rush",levels:LEVELS,start,hint,
  howto:[["⚡","Make your own superhero, then race to the finish arch!"],["◀ ▶","Hold the arrows to run. Run fast to zoom round the loops!"],["⤒","Tap Jump to leap. Bop baddies by jumping on top of them. Spiky beetles: jump over!"],
    ["💥","Tap your power button for your superpower."],["🧮","Finish a level to unlock a mission: solve maths problems to fix the Number Engines and save the worlds from Professor Muddle!"],["👾","Every 4th level is a boss: watch its shadow and run out of the way, then jump on its head while it's dizzy!"]],
  point:()=>document.getElementById("hrR"),label:n=>isBoss(n)?"👾 Boss":ZONES[zi(n)].name.split(" ")[0]+" "+((n-1)%4+1)});
window.__game={get S(){return S},K,step,IN,build,maker,mission,mathQ,get hero(){return HERO},drawHero};
requestAnimationFrame(frame);
K.start();
})();
