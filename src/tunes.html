<!DOCTYPE html>
<html lang="en">
<head>
<!--HEAD:Tile Tunes-->
<style>
.tt-wrap{position:relative;width:100%;max-width:520px;flex:1;min-height:360px;display:flex}
.tt-cv{width:100%;height:100%;display:block;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;background:#11151d}
.tt-bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.tt-bar button{border:0;border-radius:999px;padding:6px 14px;font:700 14px var(--font-body);background:var(--panel,#262b36);color:var(--text);cursor:pointer;touch-action:manipulation}
.tt-bar button[aria-pressed="true"]{background:var(--paint);color:var(--night)}
.tt-song{font:700 18px var(--font-body);text-align:center;margin:0}
.tt-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.tt-ov[hidden]{display:none}
.tt-card{background:var(--night,#161a22);color:var(--text);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px 22px;display:flex;flex-direction:column;gap:12px}
.tt-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tt-row h2{margin:0;flex:1;font-size:21px}
.tt-btn{border:0;border-radius:12px;padding:10px 14px;font:700 16px var(--font-body);background:var(--panel,#262b36);color:var(--text);cursor:pointer;touch-action:manipulation}
.tt-btn.go{background:var(--paint);color:var(--night)}
.tt-btn:disabled{opacity:.4}
.tt-list{display:flex;flex-direction:column;gap:8px}
.tt-item{display:flex;align-items:center;gap:8px;background:var(--panel,#262b36);border-radius:14px;padding:8px 10px}
.tt-item b{flex:1;font-size:16px}
.tt-item small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.tt-empty{color:var(--muted);text-align:center;margin:6px 0}
.tt-name{font:700 17px var(--font-body);padding:10px 12px;border-radius:12px;border:2px solid var(--lane);background:transparent;color:var(--text);flex:1;min-width:0}
.tt-notes{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;max-height:96px;overflow:auto;padding:6px;border:2px dashed var(--lane);border-radius:12px}
.tt-notes i{font-style:normal;font:800 13px var(--font-body);color:#fff;border-radius:7px;padding:4px 6px}
.tt-notes:empty::before{content:"Your notes show up here";color:var(--muted);font-weight:700;font-size:14px}
.tt-piano{position:relative;display:flex;height:clamp(170px,26vh,260px);user-select:none;-webkit-user-select:none;touch-action:none}
.tt-piano button{border:0;padding:0;cursor:pointer;touch-action:none;font:800 13px var(--font-body)}
.tt-piano .w{flex:1;margin:0 2px;background:#f6f3ea;border-radius:0 0 10px 10px;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-shadow:inset 0 -6px 0 var(--kc)}
.tt-piano .w span{background:var(--kc);border-radius:6px;padding:2px 5px}
.tt-piano .w sub{font-size:9px;vertical-align:baseline;margin-left:1px}
.tt-card:has(#ePiano){max-width:1000px}
.tt-piano .b{position:absolute;top:0;height:58%;background:#1d1f26;border-radius:0 0 8px 8px;z-index:2;box-shadow:inset 0 -5px 0 var(--kc)}
.tt-piano button.down{filter:brightness(.8);transform:translateY(2px)}
.tt-code{width:100%;min-height:70px;font:600 13px ui-monospace,monospace;border-radius:12px;border:2px solid var(--lane);background:transparent;color:var(--text);padding:8px;box-sizing:border-box}
.tt-song small{display:block;color:var(--muted);font-size:13px;font-weight:600}
</style>
</head>

    if(m[1]!=="R"){const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0);out.push({m:12*(+m[3]+1)+pc,b:beat,d:dur})}
    beat+=dur}
  // lanes follow the tune: higher notes step right, lower notes step left, the same note stays put
  let lane=1;out.forEach((n,i)=>{if(i){const dm=n.m-out[i-1].m;if(dm){const st=Math.sign(dm)*(Math.abs(dm)>4?2:1);let l=lane+st;if(l<0||l>3)l=lane-st;lane=Math.max(0,Math.min(3,l))}}n.lane=lane});
  return out}
/* Two songbooks share this page: games/tunes and games/carols (Christmas Tunes, cheaper so the carols are reachable by December). */
const BOOK=/\/carols\//.test(location.pathname)?"carols":"tunes";
const LIST=(BOOK==="carols"?CAROLS:SONGS).map(([title,by,bpm,notes])=>({title,by,bpm,notes:parse(notes)}));
const OPT=TS.gameSave("tunes-options",{relaxed:null});
const relaxed=()=>OPT.data.relaxed===null?K.age<=1:OPT.data.relaxed;
/* Songs are a reward: the first is free, then each song needs 5 more 🎵.
   A 🎵 comes from every level finished in the other games and every maths question answered right (TS.notes). */
const PER=BOOK==="carols"?3:5,cost=n=>(n-1)*PER,locked=n=>TS.notes.count()<cost(n)?"🔒🎵"+cost(n):false;
function earnLine(n){const have=TS.notes.count(),nx=n+1;if(nx>LIST.length)return"🎵 "+have+" · every song is open!";
  return have>=cost(nx)?"🎵 "+have+" · next song is open":"🎵 "+have+" · "+(cost(nx)-have)+" more for the next song"}
const SPEED=[.55,.62,.72,.82,.92,1,1.05,1.1];

/* ---------- the piano ---------- */
let AC=null,OUTG=null;
function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
    const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3200;OUTG=AC.createGain();OUTG.gain.value=.7;lp.connect(OUTG);OUTG.connect(AC.destination);OUTG.lp=lp}
  if(AC.state==="suspended")AC.resume();return AC}
function play(m,sec){if(TS.music.muted)return;const ac=audio();if(!ac)return;const t=ac.currentTime+.005,f=440*Math.pow(2,(m-69)/12),len=Math.max(.5,sec+.35);
  [[f,"triangle",.32],[f*2,"sine",.08],[f*3,"sine",.03]].forEach(([fr,type,v])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=fr;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(v*.35,t+.18);g.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.connect(g);g.connect(OUTG.lp);o.start(t);o.stop(t+len+.05)})}
function buzz(){if(TS.music.muted)return;const ac=audio();if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=110;
  g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(OUTG.lp);o.start(t);o.stop(t+.3)}

/* ---------- the game ---------- */
function start(n){playSong(LIST[n-1],n)}
/* n is the level number, or null for a song made with Make a Song (free to play, no stars) */
function playSong(song,n){TS.music.hold(true);
  if(S&&S.raf)cancelAnimationFrame(S.raf);
  if(n===null){K.stage.innerHTML="";K.tip("");K.sub("🎼 My song")}
  K.stage.insertAdjacentHTML("beforeend",'<p class="tt-song">'+esc(song.title)+"<small>"+esc(song.by)+" · "+(n===null?"made with Make a Song":earnLine(n))+"</small></p>"+
    '<div class="tt-wrap"><canvas class="tt-cv" id="ttCv" aria-label="Tile lanes. Tap the coloured tiles."></canvas></div>'+
    '<div class="tt-bar"><button type="button" id="ttRelax" aria-pressed="'+relaxed()+'">🐢 Wait for me</button><button type="button" id="ttNames" aria-pressed="true">🔤 Note names</button><button type="button" id="ttMine">🎼 My songs</button></div>');
  const cv=document.getElementById("ttCv");
  S={song,n,cv,ctx:cv.getContext("2d"),notes:song.notes.map(x=>({...x,hit:0,miss:0})),next:0,pos:song.notes[0].b,running:false,waiting:true,
    hearts:K.age<=2?5:3,oops:0,slow:1,names:true,flash:[],last:performance.now(),done:false};
  S.bps=song.bpm/60*SPEED[Math.min(7,K.age)];
  document.getElementById("ttRelax").onclick=e=>{OPT.data.relaxed=!relaxed();OPT.save();e.currentTarget.setAttribute("aria-pressed",relaxed());K.tip(relaxed()?"🐢 Tiles will wait at the line for you.":"🐇 Tiles keep moving. Tap them in time!")};
  document.getElementById("ttNames").onclick=e=>{S.names=!S.names;e.currentTarget.setAttribute("aria-pressed",S.names)};
  document.getElementById("ttMine").onclick=()=>MINE.open();
  cv.addEventListener("pointerdown",tap);
  K.stat(S.hearts,"Hearts");if(n!==null)K.sub();K.tip("Tap the first tile to start. Then tap each tile as it reaches the line!");
  const loop=t=>{if(S.cv!==cv)return;frame(Math.min(.05,(t-S.last)/1000));S.last=t;S.raf=requestAnimationFrame(loop)};S.raf=requestAnimationFrame(loop)}
function geom(){const cv=S.cv,r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
  const W=r.width,H=r.height;return{W,H,dpr,lw:W/4,line:H*.8,ppb:Math.max(90,H*.24)}}
function frame(dt){const g=geom(),c=S.ctx,nx=S.notes[S.next];
  if(S.running&&!S.waiting&&nx&&!S.done){S.pos+=dt*S.bps*S.slow;
    if(relaxed()){if(S.pos>=nx.b){S.pos=nx.b;S.waiting=true}}
    else if((S.pos-nx.b)*g.ppb>g.H-g.line-8){ // it slid past the bottom
      nx.miss=1;S.pos=nx.b;S.waiting=true;lose(nx.lane,"Missed one! Tap it to keep going.")}}
  c.setTransform(g.dpr,0,0,g.dpr,0,0);c.clearRect(0,0,g.W,g.H);
  for(let l=0;l<4;l++){c.fillStyle=l%2?"#151a24":"#11151d";c.fillRect(l*g.lw,0,g.lw,g.H)}
  S.flash=S.flash.filter(f=>f.t>0);S.flash.forEach(f=>{f.t-=dt;c.fillStyle="rgba(229,57,53,"+Math.max(0,f.t*1.4)+")";c.fillRect(f.l*g.lw,0,g.lw,g.H)});
  c.fillStyle="rgba(255,255,255,.18)";c.fillRect(0,g.line,g.W,3);
  // tiles
  for(let i=Math.max(0,S.next-6);i<S.notes.length;i++){const n=S.notes[i],bot=g.line-(n.b-S.pos)*g.ppb,top=bot-n.d*g.ppb+4;
    if(bot<-10)break;if(top>g.H)continue;if(n.hit>=1)continue;
    const x=n.lane*g.lw+4,w=g.lw-8,pc=n.m%12;c.globalAlpha=n.hit?1-n.hit:1;
    c.fillStyle=n.hit?"#ffffff":COL[pc];roundRect(c,x,Math.max(top,-20),w,bot-Math.max(top,-20)-2,12);c.fill();
    if(!n.hit){c.fillStyle="rgba(0,0,0,.22)";roundRect(c,x,bot-10,w,8,6);c.fill()}
    if(S.names&&!n.hit&&bot-top>26){c.fillStyle="#fff";c.font="800 "+Math.min(26,g.lw*.3)+"px system-ui,sans-serif";c.textAlign="center";c.textBaseline="bottom";c.fillText(NAMES[pc],x+w/2,bot-14)}
    if(i===S.next&&!S.running){c.fillStyle="#fff";c.font="800 18px system-ui,sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText("TAP",x+w/2,(Math.max(top,0)+bot)/2-6)}
    c.globalAlpha=1}
  S.notes.forEach(n=>{if(n.hit&&n.hit<1)n.hit=Math.min(1,n.hit+dt*5)});
  // progress along the top
  c.fillStyle="rgba(255,255,255,.12)";c.fillRect(0,0,g.W,5);c.fillStyle="#f2c230";c.fillRect(0,0,g.W*S.next/S.notes.length,5)}
function roundRect(c,x,y,w,h,r){h=Math.max(h,2);r=Math.min(r,h/2,w/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function tap(e){e.preventDefault();if(!S||S.done||K.busy)return;const g=geom(),r=S.cv.getBoundingClientRect(),lane=Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)/g.lw)));hitLane(lane)}
function hitLane(lane){const n=S.notes[S.next];if(!n)return;audio();
  const bot=g2bot(n);
  // the right lane counts even a little early (the tile may still be above the top); far too early is just ignored
  if(lane===n.lane&&bot<-geom().H)return;
  if(lane===n.lane){n.hit=.01;play(n.m,n.d/S.bps/S.slow);S.next++;
    if(!S.running){S.running=true;K.tip("")}
    // when the next tile is waiting at the line, tapping catches the song up
    if(S.waiting){S.waiting=false}
    if(S.next>=S.notes.length&&S.n===null){S.done=true;setTimeout(()=>{[72,76,79,84].forEach((m,i)=>setTimeout(()=>play(m,.3),i*110));
      MINE.open("🎉 You played "+S.song.title+(S.oops?"!":" without a mistake!"))},700);return}
    if(S.next>=S.notes.length){S.done=true;setTimeout(()=>{[72,76,79,84].forEach((m,i)=>setTimeout(()=>play(m,.3),i*110));const st=S.oops===0?3:S.oops<=2?2:1;
      const nx=S.n+1,need=nx<=LIST.length?cost(nx)-TS.notes.count():0;
      K.win({stars:st,text:"You played "+S.song.title+(st===3?" without a mistake!":"!")+(need>0?" Earn "+need+" more 🎵 to open the next song: finish levels in other games and answer maths questions.":"")})},700)}
    return}
  if(!S.running)return;lose(lane,"Oops, wrong lane! Tap the coloured tile.")}
function g2bot(n){const g=geom();return g.line-(n.b-S.pos)*g.ppb}
function lose(lane,msg){if(S.done)return;S.oops++;S.hearts--;S.flash.push({l:lane,t:.5});buzz();K.stat(Math.max(0,S.hearts),"Hearts");K.sub("Oops "+S.oops);K.tip(msg);
  if(S.hearts<=0&&S.n===null){S.done=true;K.tip("Out of hearts! Let's try that song again.");const song=S.song;setTimeout(()=>playSong(song,null),1400);return}
  if(S.hearts<=0){S.done=true;setTimeout(()=>K.fail({title:"Out of hearts",text:relaxed()?"Try again: take your time!":"Try again. Tip: turn on 🐢 Wait for me so the tiles wait for you."}),500)}}
/* Hint: an extra heart and a slower song. */
function hint(){if(!S||S.done)return;S.hearts=Math.min(9,S.hearts+1);S.slow=Math.max(.7,S.slow*.88);K.stat(S.hearts,"Hearts");K.tip("❤️ +1, and the song slows down a little.")}
/* ---------- Make a Song: tap a tune on the piano, and it becomes tiles ----------
   Songs are kept on this device for every player (so brothers and sisters can play each other's songs)
   and can be shared to another device with a song code. Timing comes from the taps: the usual gap
   between taps is one beat, and each note's length is rounded to a half, 1, 1½, 2, 3 or 4 beats. */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NM=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],nm=m=>NM[m%12]+(Math.floor(m/12)-1);
const MINE=(()=>{const KEY="tilesolve:mysongs",all=()=>TS.store.get(KEY,[]),put=l=>TS.store.set(KEY,l);
  let rec=[],ov=null,editing=false;
  function encode(notes){if(notes.length<2)return{bpm:100,code:notes.map(x=>nm(x.m)+":2").join(" ")};
    const gaps=notes.slice(1).map((x,i)=>x.t-notes[i].t),srt=[...gaps].sort((a,b)=>a-b),base=Math.max(220,Math.min(1200,srt[Math.floor(srt.length/2)]));
    const snap=v=>[.5,1,1.5,2,3,4].reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);
    return{bpm:Math.round(Math.max(60,Math.min(150,60000/base))),code:notes.map((x,i)=>nm(x.m)+":"+(i<gaps.length?snap(gaps[i]/base):2)).join(" ")}}
  const toSong=x=>({title:x.title,by:x.by,bpm:x.bpm,notes:parse(x.code)});
  const shareCode=x=>"TILETUNES|"+x.title.replace(/\|/g,"/")+"|"+x.bpm+"|"+x.code;
  function fromCode(t){const p=String(t).trim().split("|");if(p.length!==4||p[0]!=="TILETUNES")return null;
    try{if(parse(p[3]).length<2)return null}catch(e){return null}const bpm=Math.max(40,Math.min(200,+p[2]||100));return{title:p[1].slice(0,40)||"Shared song",bpm,code:p[3]}}
  function sheet(html){if(!ov){ov=document.createElement("div");ov.className="tt-ov";ov.id="ttOv";document.body.appendChild(ov);
      ov.addEventListener("click",e=>{if(e.target===ov&&!editing)close()})}
    ov.innerHTML='<div class="tt-card">'+html+"</div>";ov.hidden=false;return ov}
  function close(){if(ov)ov.hidden=true;editing=false}
  function open(msg){editing=false;const l=all(),me=K.player;
    sheet('<div class="tt-row"><h2>🎼 My songs</h2><button class="tt-btn" id="mClose" type="button">Close</button></div>'+(msg?'<p class="tt-empty" style="color:var(--text);font-size:18px">'+esc(msg)+"</p>":"")+
      '<div class="tt-list" id="mList">'+(l.length?"":'<p class="tt-empty">No songs yet. Make one!</p>')+"</div>"+
      '<div class="tt-row"><button class="tt-btn go" id="mNew" type="button">＋ Make a new song</button><button class="tt-btn" id="mAddCode" type="button">📥 Add from a code</button></div>'+
      '<div id="mCodeBox" hidden><textarea class="tt-code" id="mCode" placeholder="Paste a song code here"></textarea><div class="tt-row"><button class="tt-btn go" id="mCodeAdd" type="button">Add song</button><span id="mCodeMsg" class="tt-empty"></span></div></div>');
    const L=document.getElementById("mList");
    l.forEach((x,i)=>{const d=document.createElement("div");d.className="tt-item";
      d.innerHTML="<b>"+esc(x.title)+"<small>"+esc(x.by)+" · "+parse(x.code).length+" notes</small></b>"+
        '<button class="tt-btn go" data-a="play" type="button">▶ Play</button><button class="tt-btn" data-a="code" type="button" aria-label="Song code">📋</button><button class="tt-btn" data-a="del" type="button" aria-label="Delete">🗑️</button>';
      d.querySelector('[data-a="play"]').onclick=()=>{close();playSong(toSong(x),null)};
      d.querySelector('[data-a="code"]').onclick=e=>{const c=shareCode(x);try{navigator.clipboard.writeText(c).catch(()=>{})}catch(_){}
        let t=d.nextElementSibling;if(!t||t.tagName!=="TEXTAREA"){t=document.createElement("textarea");t.className="tt-code";t.readOnly=true;d.after(t)}t.value=c;t.select();K.tip("Song code copied. Paste it into 📥 Add from a code on another device.")};
      d.querySelector('[data-a="del"]').onclick=e=>{const b=e.currentTarget;if(b.dataset.sure){put(all().filter(y=>y.id!==x.id));open()}else{b.dataset.sure=1;b.textContent="Delete?"}};
      L.appendChild(d)});
    document.getElementById("mClose").onclick=close;
    document.getElementById("mNew").onclick=edit;
    document.getElementById("mAddCode").onclick=()=>{document.getElementById("mCodeBox").hidden=false;document.getElementById("mCode").focus()};
    document.getElementById("mCodeAdd").onclick=()=>{const x=fromCode(document.getElementById("mCode").value);
      if(!x){document.getElementById("mCodeMsg").textContent="That code doesn't look right.";return}
      put(all().concat([{...x,id:Date.now().toString(36),by:"Shared song"}]));open("Added "+x.title+"!")}}
  function edit(){editing=true;rec=[];const n=all().length+1,me=K.player;
    sheet('<div class="tt-row"><h2>🎹 Make a song</h2><button class="tt-btn" id="eBack" type="button">Back</button></div>'+
      '<div class="tt-row"><input class="tt-name" id="eName" maxlength="40" value="'+esc(me.name+"'s song "+n)+'" aria-label="Song name"></div>'+
      '<p class="tt-empty" style="margin:0">Tap the keys to play your tune at its normal speed. Wait longer on long notes!</p>'+
      '<div class="tt-notes" id="eNotes"></div><div class="tt-row" style="justify-content:space-between"><button class="tt-btn" id="eLow" type="button">◀ Lower</button><b id="eRange"></b><button class="tt-btn" id="eHigh" type="button">Higher ▶</button></div><div class="tt-piano" id="ePiano"></div>'+
      '<div class="tt-row"><button class="tt-btn" id="eUndo" type="button">↶ Undo</button><button class="tt-btn" id="eListen" type="button">▶ Listen</button><button class="tt-btn" id="eClear" type="button">🗑️ Start over</button><button class="tt-btn go" id="eSave" type="button" disabled>💾 Save</button></div>');
    /* three octaves (C3 to C6); the screen shows as many white keys as fit (10 on a phone, up to 22 on an iPad) and ◀ ▶ slide by an octave */
    const P=document.getElementById("ePiano"),WH=[];for(let m=48;m<=84;m++)if([0,2,4,5,7,9,11].includes(m%12))WH.push(m);
    const key=(m,cls,left,V)=>{const b=document.createElement("button");b.type="button";b.className=cls;b.dataset.m=m;b.style.setProperty("--kc",COL[m%12]);b.setAttribute("aria-label",nm(m));
      if(left!=null){b.style.left="calc(100%/"+V+"*"+(left+1)+" - 100%/"+V+"*.31)";b.style.width="calc(100%/"+V+"*.62)"}
      if(cls==="w")b.innerHTML="<span>"+NAMES[m%12]+(m%12===0?"<sub>"+(Math.floor(m/12)-1)+"</sub>":"")+"</span>";
      b.addEventListener("pointerdown",e=>{e.preventDefault();press(m);b.classList.add("down");setTimeout(()=>b.classList.remove("down"),140)});P.appendChild(b)};

    const draw=()=>{const fit=Math.floor(P.clientWidth/44),V=fit>=22?22:fit>=15?15:10;view=Math.max(0,Math.min(WH.length-V,view));P.innerHTML="";
      const vis=WH.slice(view,view+V);vis.forEach(m=>key(m,"w"));vis.forEach((m,i)=>{if(i<V-1&&![4,11].includes(m%12))key(m+1,"b",i,V)});
      document.getElementById("eRange").textContent=nm(vis[0]).replace("#","♯")+" – "+nm(vis[vis.length-1]);
      document.getElementById("eLow").disabled=view===0;document.getElementById("eHigh").disabled=view>=WH.length-V};
    let view=WH.indexOf(60);
    document.getElementById("eLow").onclick=()=>{view-=7;draw()};document.getElementById("eHigh").onclick=()=>{view+=7;draw()};
    draw();const onR=()=>{if(document.getElementById("ePiano"))draw();else removeEventListener("resize",onR)};addEventListener("resize",onR);
    document.getElementById("eBack").onclick=()=>open();
    document.getElementById("eUndo").onclick=()=>{rec.pop();notes()};
    document.getElementById("eClear").onclick=()=>{rec=[];notes()};
    document.getElementById("eListen").onclick=()=>{if(!rec.length)return;const{bpm,code}=encode(rec),sec=60/bpm;let t=0;
      parse(code).forEach(x=>{setTimeout(()=>play(x.m,x.d*sec),x.b*sec*1000)})};
    document.getElementById("eSave").onclick=()=>{const{bpm,code}=encode(rec),title=(document.getElementById("eName").value.trim()||"My song").slice(0,40);
      put(all().concat([{id:Date.now().toString(36),title,by:me.avatar+" "+me.name,bpm,code}]));open("Saved "+title+"! Tap ▶ Play to play it.")};
    notes()}
  function press(m){play(m,.45);rec.push({m,t:performance.now()});notes()}
  function notes(){const N=document.getElementById("eNotes");if(!N)return;N.innerHTML=rec.map(x=>'<i style="background:'+COL[x.m%12]+'">'+NAMES[x.m%12]+"</i>").join("");N.scrollTop=N.scrollHeight;
    document.getElementById("eSave").disabled=rec.length<4}
  return{open,close,edit,press,encode,fromCode,shareCode,all,get rec(){return rec},set rec(v){rec=v}}})();
K=TS_KIT({id:BOOK,name:BOOK==="carols"?"Christmas Tunes":"Tile Tunes",levels:LIST.length,start,hint,locked,
  howto:[["🎹","Coloured tiles slide down. Each one is a note of the song."],["👆","Tap each tile when it reaches the line. Tap the first tile to start."],["❤️","Wrong lane or a missed tile costs a heart."],["🐢","Turn on Wait for me and the tiles stop at the line until you tap."],["🎵","New songs open as you earn 🎵: finish levels in other games and answer maths questions."],["🎼","My songs: make your own song on the piano, then play it as tiles!"]],
  label:n=>LIST[n-1].title.length>14?LIST[n-1].title.slice(0,13)+"…":LIST[n-1].title});
window.__game={get S(){return S},K,LIST,BOOK,PER,MINE,playSong,parse,hitLane,relaxed,cost,locked};// for tools/test_tunes.py
K.start();
})();
