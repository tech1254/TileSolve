<!DOCTYPE html>
<html lang="en">
<head>
<!--HEAD:Train Trip-->
<style>
body{overflow:hidden}
.trip{height:100%;display:flex;flex-direction:column}
.tbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.tbar .left,.tbar .right{display:flex;gap:6px;align-items:center}
.tbar .right{justify-content:flex-end}
.tbar .ttl{font-family:var(--font-sign);color:var(--paint);font-size:18px;letter-spacing:.04em}
.score{font-family:var(--font-sign);font-size:17px;display:flex;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:520px){.tbar .ttl{display:none}.askc{font-size:20px;gap:8px}.askc .spk{width:42px;height:42px;font-size:20px}}
#view{position:relative;flex:1;min-height:0;overflow:hidden;background:#8ac6ff}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#signs{position:absolute;inset:0;pointer-events:none}
.sign{position:absolute;left:0;top:0;width:2.9em;height:2.4em;box-sizing:border-box;border-radius:.32em;border:.08em solid #6d4c2a;background:#fffaf0;color:#1d2230;
  display:grid;place-items:center;padding:.08em;font-family:var(--font-kid);font-weight:700;line-height:1;cursor:pointer;pointer-events:auto;
  box-shadow:0 .1em 0 #6d4c2a,0 .25em .45em rgba(0,0,0,.3);transition:opacity .45s,filter .3s,background .3s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sign.wait{pointer-events:none}
.sign .big{font-size:1.3em}
.sign .word{font-size:.7em}
.sign .lr-nd{gap:.05em}
.sign .lr-nd b{font-size:1.05em}
.sign .lr-dice{width:.95em;height:.95em;fill:#e0a800}
.sign .lr-dice.wide{width:1.7em;height:.72em}
.sign .lr-cl{font-size:.62em;gap:0 .06em}
.sign .lr-cl.m{font-size:.5em}
.sign .lr-cl.s{font-size:.38em}
.sign .lr-cl.grp i:nth-child(5n){margin-right:0}
.sign .lr-shp{width:1.75em;height:1.75em}
.sign .sw{display:block;width:2.1em;height:1.7em;border-radius:.3em;border:.06em solid rgba(0,0,0,.35)}
.sign .lr-car{width:2.4em}
.sign .ltr{font-size:1.35em}
.sign.yes{background:#d9f2cc;border-color:#2e7d32}
.sign.no{opacity:.35;filter:grayscale(1);pointer-events:none;animation:tshake .35s}
.sign.glow{animation:tglow 1s ease-in-out infinite}
.sign.gone{opacity:0;pointer-events:none}
@keyframes tshake{25%{margin-left:-.12em}75%{margin-left:.12em}}
@keyframes tglow{50%{box-shadow:0 0 0 .14em #f2c230,0 0 .7em .25em #f2c230}}
.askc{position:absolute;left:0;right:0;top:10px;margin:0 auto;width:max-content;display:flex;align-items:center;gap:12px;background:rgba(22,27,33,.88);color:#fff;border-radius:20px;
  padding:8px 18px 8px 8px;font-family:var(--font-kid);font-weight:700;font-size:clamp(20px,4.4vw,30px);line-height:1.2;max-width:calc(100% - 24px);box-sizing:border-box;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.askc .spk{width:50px;height:50px;border-radius:50%;border:0;background:var(--paint);font-size:24px;flex:none;cursor:pointer}
.askc #askT{display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
.askc b{color:var(--paint);font-size:1.15em}
.askc .sw{display:inline-block;width:1.1em;height:1.1em;border-radius:.25em;vertical-align:middle;border:2px solid rgba(255,255,255,.6)}
.askc .lr-shp{width:1.5em;height:1.5em}
.askc .lr-cl{font-size:22px}
.askc .lr-nd b{font-size:1.2em;color:var(--paint)}
.askc .lr-dice{width:34px;height:34px}
.askc .lr-dice.wide{width:60px;height:26px}
.askc .lr-car{width:40px;display:inline-block}
.askc .cars{display:inline-flex;align-items:flex-end}
.askc .emo{font-size:1.6em}
.askc .lr-tens{max-width:none}
.askc .lr-tens .rod{grid-template-rows:repeat(10,5px)}
.askc .lr-tens .rod b{width:8px}
.askc .lr-tens .one{width:9px;height:9px}
.mid{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.mid>*{pointer-events:auto}
.stcard{background:rgba(22,27,33,.92);border-radius:24px;padding:18px 26px;text-align:center;display:grid;gap:12px;justify-items:center;color:#fff;max-width:min(440px,90vw);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.stcard h2{font-family:var(--font-sign);font-weight:400;color:var(--paint);margin:0;font-size:clamp(22px,5vw,30px)}
.stcard p{margin:0;font-family:var(--font-kid);font-size:clamp(18px,4vw,22px);font-weight:700}
.gobtn{font-family:var(--font-sign);font-size:clamp(24px,6vw,32px);background:var(--good);color:#fff;border:0;border-radius:22px;padding:16px 34px;cursor:pointer;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.3);animation:tbob 1.3s ease-in-out infinite}
.gift{font-size:clamp(90px,22vw,130px);line-height:1;background:none;border:0;cursor:pointer;animation:twig 1s ease-in-out infinite;padding:0}
.carpv{width:240px;height:110px}
.bookbtn{padding:6px 12px;font-size:17px;text-transform:none}
.bookbtn.bump{animation:tbump .5s}
@keyframes tbump{40%{transform:scale(1.35)}}
.bookov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);z-index:5}
.sbook{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;width:min(400px,80vw);max-height:48vh;overflow-y:auto;padding:4px}
.sbook i{position:relative;font-style:normal;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#fff;box-shadow:0 0 0 3px #f2c230,0 3px 6px rgba(0,0,0,.3)}
.sbook i.no{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);color:rgba(255,255,255,.4);font-size:22px;font-family:var(--font-sign)}
.sbook i b{position:absolute;right:-4px;bottom:-4px;background:var(--target);color:#fff;font:700 12px var(--font-body);border-radius:10px;padding:1px 5px}
.stk{position:absolute;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:64px;
  box-shadow:0 0 0 6px #f2c230,0 10px 24px rgba(0,0,0,.35);z-index:4;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.3,.6,1),opacity .8s;animation:twig .9s ease-in-out 2}
.yardbtn{font-family:var(--font-kid);font-weight:700;font-size:20px;background:var(--panel);color:#fff;border:2px solid var(--lane);border-radius:16px;padding:10px 20px;cursor:pointer}
.yard{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:46vh;overflow-y:auto;padding:4px}
.ycar{position:relative;background:#cfe6ff;border-radius:14px;padding:4px 4px 0}
.ycar canvas{width:80px;height:73px;display:block}
.ycar button{position:absolute;top:-8px;right:-8px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:var(--target);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
@keyframes tbob{50%{transform:translateY(-6px)}}
@keyframes twig{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) scale(1.05)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
.horn{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;width:64px;height:64px;border-radius:50%;font-size:32px;background:rgba(22,27,33,.65);border:2px solid rgba(255,255,255,.35);cursor:pointer}
.horn:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){.gobtn,.gift,.sign.glow{animation:none}.sign.glow{box-shadow:0 0 0 .14em #f2c230}}
</style>
</head>
<body>
<!--KIT-->
<!--LEARN-->
<div class="trip">
  <header class="tbar">
    <div class="left"><a class="chip icon" id="kHome" href="../../index.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
      <button class="chip icon" id="kMusic" type="button"></button></div>
    <div class="ttl">TRAIN TRIP</div>
    <div class="right"><span class="score" id="score"></span><button class="chip bookbtn" id="book" type="button" aria-label="My stickers">📒 <b id="bookN">0</b></button><button class="chip icon help" id="kHelp" type="button" aria-label="How to play">?</button></div>
  </header>
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="signs"></div>
    <div class="askc" id="ask" hidden><button class="spk" id="spk" type="button" aria-label="Hear it again">🔊</button><span id="askT"></span></div>
    <button class="horn" id="horn" type="button" aria-label="Toot the horn">📯</button>
    <div class="mid" id="mid"></div>
    <div class="bookov" id="bookov" hidden><div class="stcard"><h2>My stickers</h2><p id="bookC"></p><div class="sbook" id="sbook"></div><button class="gobtn" id="bookX" type="button">Back to the train 🚂</button></div></div>
  </div>
</div>
<script>
/* Train Trip: the train rides from station to station through changing Alberta scenery (prairie, forest, mountains, lakes, towns),
   with tunnels and bridges. At every Y in the track it stops: the child listens to the question and taps the sign on the right track.
   Every station (3-5 Ys apart) has a present: a new car for the train. No levels and no checkpoints: the trip is the game.
   Questions come from one grade back (Kindergarten -> pre-K), with 2 tracks for pre-K and 3 after. Each question kind steps up after
   4 of 5 right and down after 2 misses in a row. After a miss the sign greys out and the voice says what it was; a missed question
   comes back two Ys later. */
(()=>{
const P=TS.requirePlayer(),G=TS.players.gnum(P.grade),A=Math.max(-1,Math.min(3,G-1)),U=TS_LEARN.util,R=Math.random;
const SV=TS.gameSave("trip",{cars:[],forks:0,stations:0,step:{},hist:{},bag:[]}),save=SV.data;
const $=id=>document.getElementById(id);
TS.report.game="trip";
$("kMusic").innerHTML=TS.MUSIC_SVG;TS.music.button($("kMusic"));
const HOWTO=[["🚂","Ride the train from station to station."],["🛤️","At every Y in the tracks the train stops. Listen, then tap the sign on the right track."],
  ["🎁","Every station has a present: a new car for your train!"],["📯","Tap the horn to toot!"]];
$("kHelp").onclick=()=>TS.howto.show("trip","Train Trip",HOWTO);
const NO=A<0?2:3; // tracks at each Y

/* ---------- questions ---------- */
const COLS={red:"#e2412e",blue:"#3b6fd9",green:"#43a047",yellow:"#f5c518",orange:"#f08a24",purple:"#8f5bd6",pink:"#f06fb0",brown:"#8b5a2b",grey:"#9aa3ad",black:"#262626",white:"#fafafa"};
const CLASH={red:["pink","orange","brown"],pink:["red","purple"],orange:["yellow","red","brown"],yellow:["orange"],purple:["blue","pink"],blue:["purple"],brown:["orange","red","black"],
  grey:["white","black"],black:["grey","brown"],white:["grey"],green:[]};
const EMS=U.fav([["🦆","ducks"],["🐄","cows"],["🐑","sheep"],["⭐","stars"],["🍎","apples"],["🐟","fish"]]);
const art=w=>(/^[aeiou]/.test(w)?"an ":"a ")+w;
const CONF=[[6,9],[2,5],[1,7]],bad=(a,b)=>CONF.some(([x,y])=>(a===x&&b===y)||(a===y&&b===x));
// the answer first, then n-1 different distractors within [lo,hi]; gap = smallest difference from every other option
function nums(ans,n,lo,hi,spread,gap){const o=[ans];let g=0;gap=gap||1;
  while(o.length<n&&g++<400){const v=ans+U.ri(R,-spread,spread);if(v<lo||v>hi||o.includes(v)||o.some(x=>Math.abs(x-v)<gap||(A<0&&bad(x,v))))continue;o.push(v)}
  for(let v=lo;o.length<n;v++)if(!o.includes(v))o.push(v);return o}
// typical slips for sums: one off, ten off
function slips(ans,n,lo,tens){const c=U.shuffle(R,[ans+1,ans-1,ans+2,ans-2].concat(tens?[ans+10,ans-10,ans+10]:[]));const o=[ans];
  for(const v of c)if(o.length<n&&v>=lo&&!o.includes(v))o.push(v);for(let v=ans+3;o.length<n;v++)o.push(v);return o}
const pics=(em,v)=>U.cluster(em,v,v<=2?v:v<=4?2:v<=6?3:5).replace('class="lr-cl','class="lr-cl'+(v<=4?"":v<=6?" m":" s")),big=v=>'<span class="big">'+v+"</span>",nd=v=>A<0?U.numdots(v):big(v);
function mk(kind,say,ask,list,opt,hint){const o=list.map(opt),q={kind,say,ask,ans:o[0].key,opts:U.shuffle(R,o),hint:hint||""};return q}
const NAME=[...new Set((P.name||"").toUpperCase().replace(/[^A-Z]/g,""))];
const SAFE_WORDS=[["🐟","fish"],["🐶","dog"],["☀️","sun"],["🦊","fox"],["🐝","bee"],["🌙","moon"],["🐷","pig"],["🦆","duck"],["🐭","mouse"],["🎩","hat"],["🐻","bear"],["🐐","goat"],
  ["🦁","lion"],["🚌","bus"],["🧦","sock"],["💍","ring"],["🦓","zebra"],["🐢","turtle"],["🌮","taco"],["🍋","lemon"],["🐮","cow"],["🎈","balloon"],["🍩","donut"],["🪁","kite"],["🪵","log"],["🐴","horse"]];

const KINDS={
  num(st){const max=A<0?[4,5,7,10][st]:[10,10,20,20][st],N=U.ri(R,1,max),vs=nums(N,NO,1,max,A<0?4:3,A<0&&st<2?2:1);
    const show=A<0?(st===0?U.numdots(N):st===1?"<b>"+N+"</b>":"<b>?</b> 👂"):(st===0?"<b>"+N+"</b>":"<b>?</b> 👂");
    return mk("num","Take track "+N+"!","🚂 Take track "+show,vs,v=>({key:v,html:nd(v),say:"track "+v}),"We need track "+N+".")},
  count(st){const [em,nm]=U.pick(R,EMS),max=A<0?[3,4,5,6][st]:[6,8,10,10][st],N=U.ri(R,1,max),vs=nums(N,NO,1,max,3,A<0&&st<2?2:1);
    return mk("count","Which track has "+N+" "+nm+"? Count them.","Which track has <b>"+N+"</b> "+em+"?",vs,
      v=>({key:v,html:pics(em,v),say:String(v)}),"We need "+N+". Count again!")},
  colour(st){const c=U.pick(R,["red","blue","green","yellow","orange","purple","pink","brown","grey","black","white","brown","grey","pink","purple"]);
    const others=Object.keys(COLS).filter(x=>x!==c&&(st>=2||!CLASH[c].includes(x))),vs=[c].concat(U.sample(R,others,NO-1));
    return mk("colour","Take the "+c+" track!","Take the "+(st===0?'<span class="sw" style="background:'+COLS[c]+'"></span>':"")+"<b>"+c+"</b> track",vs,
      x=>({key:x,html:'<span class="sw" style="background:'+COLS[x]+'"></span>',say:x}),"We need "+c+".")},
  shape(st){const base=A<0?(st<1?["circle","square","triangle"]:["circle","square","triangle","rectangle","star","heart"]):["circle","square","triangle","rectangle","star","heart","oval"];
    const t=U.pick(R,base),near=(a,b)=>st<2&&[["square","rectangle"],["circle","oval"]].some(p=>p.includes(a)&&p.includes(b));
    const vs=[t].concat(U.sample(R,base.filter(x=>x!==t&&!near(t,x)),NO-1));
    const draw=k=>{let kind=k,rot=0,sc=1;if(k==="triangle"&&(A>=0||st>=2)&&R()<.6)kind=U.pick(R,["tri_tall","tri_right","tri_wide"]);
      if(A>=0&&st>=1){rot=U.pick(R,[0,0,15,30,45,180]);sc=U.pick(R,[.7,.85,1])}return U.shape(kind,U.pick(R,U.SHAPE_COLS),rot,sc)};
    return mk("shape","Take the "+t+" track!","Take the "+(st===0?U.shape(t,"#ffffff",0,1,true):"")+"<b>"+t+"</b> track",vs,x=>({key:x,html:draw(x),say:art(x)}),"We need "+art(t)+".")},
  letter(st){const EASY="BDMPTSOXACLH".split("").concat(A>=0?"EFGKNRW".split(""):[]);
    const t=NAME.length&&R()<(A<0?.6:.35)?U.pick(R,NAME):U.pick(R,EASY),TW=["BDPQ","MNW","UN","CGO","EF","IL"],twin=x=>TW.some(g=>g.includes(x)&&g.includes(t));
    const vs=[t].concat(U.sample(R,"ABCDEFGHIJKLMNOPRSTUVWXYZ".split("").filter(x=>x!==t&&(st>=3||!twin(x))),NO-1)),low=A>=0&&st>=1;
    const inName=NAME.includes(t)?" "+t+" is in your name!":"";
    const ask=low?"Find little <b>"+t.toLowerCase()+"</b> <small>("+t+")</small>":(A<0&&st>=1?"Find the letter <b>?</b> 👂":"Find the letter <b>"+t+"</b>");
    return mk("letter",low?"Find little "+t.toLowerCase()+"!":"Find the letter "+t+"!"+inName,ask,vs,
      x=>({key:x,html:'<span class="ltr">'+(low?x.toLowerCase():x)+"</span>",say:low?"little "+x.toLowerCase():x}),"We need "+(low?"little ":"")+t+".")},
  more(st){const [em,nm]=U.pick(R,EMS),max=A<0?6:10,fewer=st>=2&&R()<.5,gap=A<0?[3,2,1,1][st]:[3,2,1,1][st];let vs,g=0;
    do vs=Array.from({length:NO},()=>U.ri(R,1,max));while(g++<500&&(new Set(vs).size<NO||vs.some((x,i)=>vs.some((y,j)=>i!==j&&Math.abs(x-y)<gap))));
    if(new Set(vs).size<NO)vs=NO===2?[1,4]:[1,4,7];
    const ans=fewer?Math.min(...vs):Math.max(...vs),list=[ans].concat(vs.filter(x=>x!==ans));
    const w=NO===2?(fewer?"fewer":"more"):(fewer?"the fewest":"the most");
    return mk("more","Which track has "+w+" "+nm+"?","Which track has <b>"+w+"</b> "+em+"?",list,v=>({key:v,html:pics(em,v),say:"the track with "+v}),
      "Look for "+w+".")},
  onemore(st){const less=st>=2&&R()<.5,N=U.ri(R,less?2:1,9),ans=less?N-1:N+1,vs=[ans,N].concat(nums(ans,4,0,11,2).filter(x=>x!==N&&x!==ans)).slice(0,NO);
    return mk("onemore","What is one "+(less?"less":"more")+" than "+N+"?","One "+(less?"less":"more")+" than <b>"+N+"</b>?",vs,v=>({key:v,html:big(v),say:String(v)}),
      (less?"Count back":"Count on")+" one from "+N+".")},
  addpic(st){const [em,nm]=U.pick(R,EMS),max=st<2?5:10,a=U.ri(R,1,max-1),b=U.ri(R,1,Math.min(4,max-a)),ans=a+b,vs=nums(ans,NO,1,max+1,2);
    return mk("addpic",a+" "+nm+", and "+b+" more. How many altogether?",U.cluster(em,a,Math.min(a,5))+" <b>+</b> "+U.cluster(em,b,b)+" <b>= ?</b>",vs,
      v=>({key:v,html:big(v),say:String(v)}),"Count them all: start at "+a+".")},
  pattern(st){const core=st<1?"AB":U.pick(R,["AB","ABC","AAB","ABB"]),cs=U.sample(R,["red","blue","yellow","green","purple","orange"],3),L=core.length,len=Math.max(L*2,4);
    const at=k=>cs["ABC".indexOf(core[k%L])],ans=at(len),used=[...new Set(core)].map(c=>cs["ABC".indexOf(c)]),vs=[ans];
    for(const c of U.shuffle(R,used.concat(cs)))if(vs.length<NO&&!vs.includes(c))vs.push(c);
    return mk("pattern","What colour car comes next?",'<span class="cars">'+Array.from({length:len},(_,k)=>U.car(COLS[at(k)],"")).join("")+U.car("#9aa3ad","?")+"</span>",vs,
      c=>({key:c,html:U.car(COLS[c],""),say:art(c)+" car"}),"Say the colours out loud.")},
  add(st){let a,b,max;if(A<=1){max=[10,15,20,20][st];a=U.ri(R,1,max-1);b=U.ri(R,1,Math.min(10,max-a));if(st===2&&R()<.5)b=a<=10?a:b}
    else if(A===2){if(st===0){a=10*U.ri(R,1,7)+U.ri(R,0,5);b=10*U.ri(R,1,8-Math.floor(a/10))+U.ri(R,0,9-a%10)}else{a=U.ri(R,11,80);b=U.ri(R,5,99-a)}}
    else{a=U.ri(R,100,800);b=U.ri(R,10,999-a)}
    const ans=a+b;return mk("add","What is "+a+" plus "+b+"?","<b>"+a+" + "+b+" = ?</b>",slips(ans,NO,0,A>=2||st>=2),v=>({key:v,html:big(v),say:String(v)}),"Start at "+a+" and count on "+b+".")},
  sub(st){let a,b;if(A<=1){const max=[10,15,20,20][st];a=U.ri(R,3,max);b=U.ri(R,1,Math.min(10,a-1))}else if(A===2){a=U.ri(R,st?30:20,99);b=st?U.ri(R,5,a-10):U.ri(R,1,a%10||1)}
    else{a=U.ri(R,300,999);b=U.ri(R,20,a-100)}
    const ans=a-b;return mk("sub","What is "+a+" take away "+b+"?","<b>"+a+" − "+b+" = ?</b>",slips(ans,NO,0,A>=2||st>=2),v=>({key:v,html:big(v),say:String(v)}),"Start at "+a+" and count back "+b+".")},
  missing(st){const by=st===3?10:1,back=st===2,s=back?U.ri(R,5,20):st===0?U.ri(R,1,16):st===1?10*U.ri(R,1,9)-U.ri(R,1,3):10*U.ri(R,0,6);

/* ---------- the Y: signs, asking, answering ---------- */
let legMiss=0,legT0=Date.now();
function setupFork(f){f.q=newQ();f.signs=f.q.opts.map((o,k)=>{const el=document.createElement("button");el.type="button";el.className="sign wait";el.innerHTML=o.html;
  el.setAttribute("aria-label",o.say);el.onclick=()=>tap(f,k);$("signs").appendChild(el);return{el,k}})}
function askNow(f){const q=f.q;$("askT").innerHTML=q.ask;$("ask").hidden=false;f.signs.forEach(x=>x.el.classList.remove("wait"));
  TS.say((save.forks===0&&!f.miss?"Tap a sign to choose a track. ":"")+q.say)}
$("spk").onclick=()=>{const f=STOPS[sp];if(f&&f.q)TS.say(f.q.say)};
function tap(f,k){if(mode!=="ask"||STOPS[sp]!==f||f.choice!=null)return;const q=f.q,o=q.opts[k],sg=f.signs[k];
  if(o.key===q.ans){f.choice=k;TS.music.fx("good");sg.el.classList.remove("glow");sg.el.classList.add("yes");f.signs.forEach((x,j)=>{if(j!==k)x.el.classList.add("gone")});
    TS.say(U.pick(R,["Yes!","Great!","You got it!","Right track!","All aboard!"])+" "+o.say[0].toUpperCase()+o.say.slice(1)+"!");
    learnt(q.kind,!f.miss);save.forks++;const got=maybeSticker(f,!f.miss);save.sinceStk=sinceStk;SV.save();sp++;mode="go";
    if(got)setTimeout(()=>TS.say("A sticker! A "+got[1]+" for your sticker book!"),1000);
    setTimeout(()=>{$("ask").hidden=true;toot();mode="run"},got?2300:900);return}
  f.miss++;legMiss++;TS.music.fx("bad");sg.el.classList.add("no");
  const right=f.signs[q.opts.findIndex(x=>x.key===q.ans)].el,left=f.signs.filter(x=>!x.el.classList.contains("no")).length;
  TS.say("That's "+o.say+". "+(f.miss>=2||left===1?"This sign is the one. Tap it!":q.hint));
  if(f.miss>=2||left===1)right.classList.add("glow");
  if(f.miss===1&&!q.again)retry.push({q,due:save.forks+2})}
function placeSigns(){for(const f of FORKS){if(!f.signs.length)continue;const sx=(f.xm+46-camX)*s;
  if(sx<-200&&f.choice!=null){f.signs.forEach(x=>x.el.remove());f.signs=[];continue}
  if(f.choice!=null&&tx>f.xm-20)f.signs[f.choice].el.classList.add("gone");
  f.signs.forEach((x,k)=>{const w=x.el.offsetWidth,h=x.el.offsetHeight;x.el.style.transform="translate("+(sx-w/2)+"px,"+((BASE+f.offs[k])*s-h/2)+"px)"})}}

/* ---------- stickers: sometimes a right answer pops out a sticker for the sticker book ---------- */
const STK=(()=>{const f=TS.players.fav&&TS.players.fav(),fav=f?f.em:[];const base=[["🚂","steam train"],["🚄","fast train"],["🚇","subway train"],["🚋","tram"],["🚞","mountain train"],["🚉","station"],
  ["🦬","bison"],["🫎","moose"],["🦌","deer"],["🐻","bear"],["🦫","beaver"],["🦉","owl"],["🦅","eagle"],["🐿️","squirrel"],["🐺","wolf"],["🦊","fox"],["🐇","bunny"],["🦆","duck"],["🐸","frog"],["🦋","butterfly"],
  ["⭐","star"],["🌈","rainbow"],["🎈","balloon"],["🍦","ice cream"],["🍩","donut"],["🧸","teddy bear"],["🚀","rocket"],["🦖","dinosaur"],["🦄","unicorn"],["🏆","trophy"],["🌻","sunflower"],["🍁","maple leaf"],
  ["❄️","snowflake"],["🌞","sunshine"],["🐶","puppy"],["🐱","kitty"],["🚜","tractor"],["🚒","fire truck"],["⚽","soccer ball"],["🎉","party"]];
  const seen=new Set(),out=[];for(const x of fav.concat(base))if(!seen.has(x[0])){seen.add(x[0]);out.push(x)}return out})();
save.stk=save.stk||{};let sinceStk=save.sinceStk||0;
function bookN(){$("bookN").textContent=Object.keys(save.stk).length}
function maybeSticker(f,firstTry){if(!firstTry){sinceStk=0;return null}sinceStk++;
  if(!(R()<.33||sinceStk>=3))return null;sinceStk=0;save.sinceStk=0;
  const fresh=STK.filter(x=>!save.stk[x[0]]),st=U.pick(R,fresh.length?fresh:STK);save.stk[st[0]]=(save.stk[st[0]]||0)+1;SV.save();
  const k=f.choice,el=document.createElement("div");el.className="stk";el.textContent=st[0];
  const sx=(f.xm+46-camX)*s,sy=(BASE+f.offs[k])*s-60*s;el.style.transform="translate("+sx+"px,"+sy+"px)";$("view").appendChild(el);TS.music.fx("win");
  setTimeout(()=>{const b=$("book").getBoundingClientRect(),v=$("view").getBoundingClientRect();el.style.animation="none";
    el.style.transform="translate("+(b.left+b.width/2-v.left)+"px,"+(b.top+b.height/2-v.top)+"px) scale(.25)";el.style.opacity=".2"},1300);
  setTimeout(()=>{el.remove();bookN();$("book").classList.remove("bump");void $("book").offsetWidth;$("book").classList.add("bump")},2150);
  return st}
let paused=false;
function openBook(){paused=true;const have=STK.filter(x=>save.stk[x[0]]).length;$("bookC").textContent=have+" of "+STK.length+" stickers";
  $("sbook").innerHTML=STK.map(x=>save.stk[x[0]]?'<i title="'+x[1]+'">'+x[0]+(save.stk[x[0]]>1?"<b>×"+save.stk[x[0]]+"</b>":"")+"</i>":'<i class="no">?</i>').join("");
  $("bookov").hidden=false;TS.say(have?"You have "+have+" stickers!":"No stickers yet. Pick the right tracks to find some!")}
$("book").onclick=openBook;$("bookX").onclick=()=>{$("bookov").hidden=true;paused=false};
$("sbook").addEventListener("click",e=>{const i=e.target.closest("i");if(!i||i.classList.contains("no"))return;const x=STK.find(y=>i.textContent.startsWith(y[0]));if(x)TS.say(x[1])});

/* ---------- stations and presents ---------- */
function card(html){$("mid").innerHTML=html?'<div class="stcard">'+html+"</div>":""}
function score(){$("score").innerHTML="<span>🚉 "+save.stations+"</span><span>🚃 "+save.cars.length+"</span>"}
function nextName(){const st=STOPS.slice(sp).find(x=>x.type==="station");return st?st.name:stName(save.stations+1)}
function thumb(cvs,c){const o=ctx;ctx=cvs.getContext("2d");ctx.setTransform(1.15,0,0,1.15,cvs.width/2,cvs.height-4);drawCar(c);ctx=o}
function startCard(title){const nx=nextName();card("<h2>"+(title||"All aboard, "+(P.name||"friend")+"!")+"</h2><p>Next stop: "+nx+" "+gives(nx)[1]+"</p><button class=\"gobtn\" id=\"go\" type=\"button\">▶ Go!</button>"+
    (save.cars.length?'<button class="yardbtn" id="yard" type="button">🚃 My train</button>':""));
  $("go").onclick=()=>{card("");TS.say("All aboard! Next stop, "+nx+"!");toot();legT0=Date.now();legMiss=0;mode="run"};
  if($("yard"))$("yard").onclick=()=>yard(title)}
/* My train: see every car, and tap ✖ to leave one at the station */
function yard(title){const st=STATIONS.find(x=>x.stop===tx),here=st?st.name:"the station";
  card("<h2>Your train</h2><p>Tap ✖ to leave a car at "+here+".</p><div class=\"yard\" id=\"yl\"></div><button class=\"gobtn\" id=\"done\" type=\"button\">Done</button>");
  const yl=$("yl");
  const draw=()=>{yl.innerHTML="";if(!save.cars.length)yl.innerHTML="<p>Just the engine!</p>";
    save.cars.forEach((c,i)=>{const d=document.createElement("div");d.className="ycar";d.innerHTML='<canvas width="120" height="110"></canvas><button type="button" aria-label="Leave the '+CARS[c.k]+'">✖</button>';
      thumb(d.firstChild,c);d.lastChild.onclick=()=>{save.cars.splice(i,1);SV.save();score();TS.music.fx("tap");TS.say("Bye bye, "+CARS[c.k]+"!");draw()};yl.appendChild(d)})};
  draw();TS.say("Here's your train. Tap the X to leave a car at the station.");$("done").onclick=()=>startCard(title)}
function atStation(st){mode="station";legsDone++;save.stations++;SV.save();score();TS.notes.addMath(); // a 🎵 for Tile Tunes
  TS.report.log({t:"play",game:"trip",level:save.stations,result:"win",stars:legMiss===0?3:legMiss<=2?2:1,ms:Date.now()-legT0,oops:legMiss,hints:0});
  card("<h2>"+st.name+"!</h2><button class=\"gift\" id=\"gift\" type=\"button\" aria-label=\"Open the present\">🎁</button><p>"+st.name+" has a present for your train! Tap it!</p>");
  TS.say(st.name+" station! There's a present for your train. Tap it to open it!");
  $("gift").onclick=()=>{const c=newCar(st.name);TS.music.fx("win");confetti();
    card("<h2>A "+CARS[c.k]+" from "+st.name+"!</h2><canvas class=\"carpv\" id=\"pv\" width=\"480\" height=\"220\"></canvas><button class=\"gobtn\" id=\"hook\" type=\"button\">Hook it on! 🚃</button>");
    const pc=$("pv").getContext("2d"),save2=ctx;ctx=pc;ctx.setTransform(2.1,0,0,2.1,240,205);drawCar(c);ctx=save2;
    TS.say("Wow! A new "+CARS[c.k]+"! Hook it on to your train!");
    $("hook").onclick=()=>{save.cars.push(c);SV.save();score();TS.music.fx("good");startCard("All aboard!");TS.say("Clunk! It's on! Tap Go when you're ready.")}}}

/* ---------- main loop ---------- */
let last=0;
function frame(t){const dt=Math.min(.05,(t-(last||t))/1000);last=t;T+=dt;
  const tgt=STOPS[sp];
  if(mode==="run"&&tgt&&!paused){const d=tgt.stop-tx,want=Math.min(CRUISE,Math.sqrt(Math.max(0,2*DEC*d))+4);v=v>want?want:Math.min(want,v+ACC*dt);
    tx=Math.min(tgt.stop,tx+v*dt);wheelA+=v*dt/13;if(tgt.stop-tx<.5){tx=tgt.stop;v=0;if(tgt.type==="fork"){mode="ask";askNow(tgt)}else{sp++;atStation(tgt)}}}
  camX=tx-vw*FRONT;
  if(tgt&&tgt.type==="fork"&&!tgt.q&&tgt.xs-camX<vw+500)setupFork(tgt);
  const nextSt=STOPS.slice(sp).find(x=>x.type==="station");if(nextSt&&!nextSt.made&&nextSt.stop-camX<vw+900){nextSt.made=true;newLeg(nextSt.stop)}
  // tidy up things far behind the end of the train
  const back=camX-(save.cars.length+2)*(CAR+GAP)-1500;for(const L of [FORKS,RIVERS,TUNNELS,STATIONS])while(L.length>2&&(L[0].xf||L[0].x1)<back&&!L[0].signs?.length)L.shift();
  if(v>5&&R()<dt*(2+v/30))puff(false);else if(R()<dt*.8)puff(false);
  for(const p of puffs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*14;p.a-=dt*.45}while(puffs.length&&puffs[0].a<=0)puffs.shift();
  for(const b of bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=600*dt;b.t+=dt}while(bits.length&&bits[0].t>2.5)bits.shift();
  spawn();draw();placeSigns();requestAnimationFrame(frame)}
let curB="prairie",prevB="prairie",bt=1;
function draw(){ctx.setTransform(dpr*s,0,0,dpr*s,0,0);
  const b=biomeAt(camX+vw*.5);if(b!==curB){prevB=curB;curB=b;bt=0}bt=Math.min(1,bt+.012);const p=BIO[prevB],q=BIO[curB],c=k=>mixC(p[k],q[k],bt);
  let g=ctx.createLinearGradient(0,0,0,HOR);g.addColorStop(0,c("sky"));g.addColorStop(1,c("sky2"));ctx.fillStyle=g;ctx.fillRect(0,0,vw,HOR+6);
  ctx.fillStyle="#ffe680";ctx.beginPath();ctx.arc(vw-90,Math.min(70,HOR*.45),26,0,7);ctx.fill();ctx.fillStyle="rgba(255,230,128,.25)";ctx.beginPath();ctx.arc(vw-90,Math.min(70,HOR*.45),40,0,7);ctx.fill();
  const layer=L=>{const o=lcam(L);for(const it of L.items)if(it.d)it.d(it.x-o)};
  layer(LAY[0]);layer(LAY[1]);
  g=ctx.createLinearGradient(0,HOR,0,vh);g.addColorStop(0,c("g1"));g.addColorStop(1,c("g2"));ctx.fillStyle=g;ctx.fillRect(0,HOR+4,vw,vh-HOR);
  layer(LAY[2]);for(const r of RIVERS)drawRiver(r);layer(LAY[3]);
  const P2=LAY[4],o=lcam(P2),ps=P2.items.filter(i=>i.pole);ctx.strokeStyle="rgba(40,40,40,.55)";ctx.lineWidth=1.2;
  for(let k=1;k<ps.length;k++){if(ps[k].x-ps[k-1].x>250)continue;for(const dy of [-60,-50]){const y=BASE-140+dy+4;ctx.beginPath();ctx.moveTo(ps[k-1].x-o,y);ctx.quadraticCurveTo((ps[k-1].x+ps[k].x)/2-o,y+12,ps[k].x-o,y);ctx.stroke()}}
  layer(P2);
  for(const st of STATIONS)drawStationBack(st);for(const f of FORKS)drawSignal(f);for(const r of RIVERS)drawBridges(r);
  drawTracks();for(const t of TUNNELS)tunnel(t);drawTrain();
  for(const p of puffs){ctx.fillStyle="rgba(240,240,240,"+Math.max(0,p.a)+")";ctx.beginPath();ctx.arc(p.x-camX,p.y,p.r,0,7);ctx.fill()}
  for(const st of STATIONS)drawStationFront(st);layer(LAY[5]);layer(LAY[6]);
  for(const b of bits){ctx.fillStyle=b.c;ctx.fillRect(b.x-b.r/2,b.y-b.r/2,b.r+3,b.r+6)}}

/* ---------- start at the station the player last reached ---------- */
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this};
TS.horn.load();resize();score();bookN();const st0=station(0,stName(save.stations));STOPS.push(st0);sp=1;newLeg(0);
startCard();requestAnimationFrame(frame);
TS.howto.first("trip","Train Trip",HOWTO);
window.__trip={STK,openBook,tunnels:()=>TUNNELS,gives,get station(){return STATIONS.find(x=>x.stop===tx)},get mode(){return mode},get fork(){const f=STOPS[sp];return f&&f.type==="fork"?f:null},tap,save,get tx(){return tx},
  /* tests: answer the waiting Y right (or wrong), skip ahead to the next stop */
  right(){const f=STOPS[sp];if(f&&f.q)tap(f,f.q.opts.findIndex(o=>o.key===f.q.ans))},wrong(){const f=STOPS[sp];if(f&&f.q)tap(f,f.q.opts.findIndex(o=>o.key!==f.q.ans&&!f.signs[f.q.opts.indexOf(o)].el.classList.contains("no")))},
  skip(){const f=STOPS[sp];if(f&&mode==="run")tx=f.stop-1}};
})();
</script>
