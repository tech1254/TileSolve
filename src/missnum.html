<!DOCTYPE html>
<html lang="en">
<head>
<!--HEAD:Missing Number-->
</head>
<body>
<!--KIT-->
<!--LEARN-->
<script>
(()=>{const U=TS_LEARN.util;
TS_LEARN({id:"missnum",name:"Missing Number",howto:[["🔢", "The numbers are counting along."], ["❓", "One number is missing."], ["👆", "Tap the number that goes in the box."], ["🔊", "Tap the speaker to hear it again."]],
make(n,i,r,a){let len,step,s,hole,count;
  if(a<=0){len=4;step=1;s=U.ri(r,1,7);hole=n<=10?3:U.ri(r,0,3);count=3}
  else if(a===1){len=5;count=4;if(n<=15){step=1;s=U.ri(r,1,16)}else if(n<=28){step=-1;s=U.ri(r,6,20)}else{step=2;s=2*U.ri(r,1,6)}hole=U.ri(r,1,4)}
  else{len=5;count=4;step=U.pick(r,n<=12?[2,5]:[2,5,10]);s=step*U.ri(r,1,step===10?5:step===5?10:20);if(n>25&&i%2===1){s+=step*4;step=-step}hole=U.ri(r,1,4)}
  const seq=Array.from({length:len},(_,k)=>s+k*step),ans=seq[hole],m=Math.abs(step),opts=new Set([ans]);
  for(const d of U.shuffle(r,[m,-m,1,-1,2*m,-2*m,2,-2]))if(opts.size<count&&ans+d>=0)opts.add(ans+d);
  return{type:"pick",say:"What number is missing?"+(step<0?" These count backwards!":""),
    prompt:'<span class="ask">What number is missing?</span><span class="seq">'+seq.map((v,k)=>k===hole?'<b class="q">?</b>':"<b>"+v+"</b>").join("")+"</span>",
    options:U.shuffle(r,[...opts]).map(v=>({key:v,html:String(v),say:String(v)})),answer:ans}}});
})();
</script>
</body>
</html>
